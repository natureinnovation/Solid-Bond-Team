<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature Innovation</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: "Prompt", sans-serif;
            color: #e8f5e9;

            /* พื้นหลังไล่สีดำ-เขียว ขยับช้า ๆ */
            background: linear-gradient(to top,
                #000000 0%, #0b2414 20%, #1f5130 40%, #2e6b3f 50%,
                #1f5130 60%, #0b2414 80%, #000000 100%);
            background-size: 100% 200%;
            background-attachment: fixed;
            animation: bgMove 10s ease-in-out infinite alternate;
        }

        @keyframes bgMove {
            0%   { background-position: 50% 100%; }
            100% { background-position: 50% 50%; }
        }

        /* ===== ระบบหน้าจอ ===== */
        .screen {
            display: none;
            min-height: 100vh;
            padding: 48px 20px;
            flex-direction: column;
            align-items: center;
        }

        .screen.active {
            display: flex;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .panel {
            width: 100%;
            max-width: 900px;
        }

        .panel.wide {
            max-width: 1100px;
        }

        /* ===== หน้าแรก ===== */
        #home {
            justify-content: center;
            text-align: center;
            gap: 40px;
        }

        h1 {
            font-size: clamp(2rem, 6vw, 3.5rem);
            font-weight: 600;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }

        .lead {
            font-size: clamp(1rem, 3vw, 1.2rem);
            font-weight: 300;
            color: #c8e6c9;
            max-width: 520px;
            line-height: 1.7;
        }

        .start-btn {
            font-family: inherit;
            font-size: 1.25rem;
            font-weight: 500;
            color: #ffffff;
            padding: 18px 56px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            background: linear-gradient(to bottom, #6a9f4e, #4a7c36);
            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.55),
                0 25px 60px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.25);
            transition: background 0.3s, box-shadow 0.3s;
        }

        .start-btn:hover {
            background: linear-gradient(to bottom, #7cb35c, #558b3f);
            box-shadow:
                0 15px 35px rgba(0, 0, 0, 0.6),
                0 35px 80px rgba(0, 0, 0, 0.7),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .start-btn:active {
            transform: translateY(2px);
        }

        /* ===== ส่วนหัวของหน้าเลือก ===== */
        .back-btn {
            font-family: inherit;
            font-size: 0.95rem;
            color: #c8e6c9;
            background: transparent;
            border: 1px solid rgba(200, 230, 201, 0.25);
            border-radius: 50px;
            padding: 8px 20px;
            cursor: pointer;
            margin-bottom: 28px;
            transition: background 0.25s, border-color 0.25s;
        }

        .back-btn:hover {
            background: rgba(106, 159, 78, 0.15);
            border-color: rgba(124, 179, 92, 0.6);
        }

        h2 {
            font-size: clamp(1.6rem, 4vw, 2.2rem);
            font-weight: 500;
            margin-bottom: 8px;
        }

        .subtitle {
            font-weight: 300;
            color: #a5d6a7;
            margin-bottom: 32px;
        }

        /* ===== การ์ด ===== */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 16px;
        }

        .grid.small {
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 12px;
        }

        .card {
            font-family: inherit;
            color: inherit;
            text-align: left;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(200, 230, 201, 0.12);
            border-radius: 20px;
            padding: 24px;
            cursor: pointer;
            backdrop-filter: blur(6px);
            transition: transform 0.25s, background 0.25s, border-color 0.25s, box-shadow 0.25s;
        }

        .card:hover {
            transform: translateY(-4px);
            background: rgba(106, 159, 78, 0.15);
            border-color: rgba(124, 179, 92, 0.5);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.45);
        }

        .card .icon {
            font-size: 2rem;
            margin-bottom: 12px;
        }

        .card .name {
            font-size: 1.2rem;
            font-weight: 500;
        }

        .card .count {
            font-size: 0.9rem;
            font-weight: 300;
            color: #a5d6a7;
            margin-top: 4px;
        }

        .card.province {
            text-align: center;
            padding: 16px 12px;
            font-size: 1rem;
            border-radius: 16px;
        }

        /* ===== ช่องค้นหา ===== */
        .search {
            width: 100%;
            font-family: inherit;
            font-size: 1rem;
            color: #e8f5e9;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(200, 230, 201, 0.2);
            border-radius: 50px;
            padding: 14px 22px;
            margin-bottom: 24px;
            outline: none;
            transition: border-color 0.25s;
        }

        .search::placeholder {
            color: rgba(200, 230, 201, 0.5);
        }

        .search:focus {
            border-color: rgba(124, 179, 92, 0.7);
        }

        .empty {
            display: none;
            text-align: center;
            color: #a5d6a7;
            font-weight: 300;
            padding: 30px 0;
        }

        /* ===== หน้าต่างข้อมูลจังหวัด ===== */
        .window {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(200, 230, 201, 0.12);
            border-radius: 24px;
            overflow: hidden;
            backdrop-filter: blur(8px);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
        }

        /* แถบหัวหน้าต่าง: ชื่อจังหวัด */
        .window-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            padding: 22px 28px;
            background: rgba(106, 159, 78, 0.12);
            border-bottom: 1px solid rgba(200, 230, 201, 0.12);
        }

        .window-header h2 {
            margin: 0;
        }

        .region-tag {
            font-size: 0.85rem;
            color: #a5d6a7;
            border: 1px solid rgba(165, 214, 167, 0.3);
            border-radius: 50px;
            padding: 4px 14px;
        }

        .window-body {
            display: grid;
            grid-template-columns: 240px 1fr;
            min-height: 460px;
        }

        /* เมนูด้านซ้าย */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 20px 14px;
            border-right: 1px solid rgba(200, 230, 201, 0.1);
        }

        .menu-item {
            position: relative;
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: inherit;
            font-size: 1rem;
            color: #c8e6c9;
            text-align: left;
            background: transparent;
            border: none;
            border-radius: 14px;
            padding: 13px 16px;
            cursor: pointer;
            transition: background 0.25s, color 0.25s;
        }

        .menu-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
        }

        /* เมนูที่กำลังเลือกอยู่ */
        .menu-item.active {
            background: rgba(106, 159, 78, 0.22);
            color: #ffffff;
            font-weight: 500;
        }

        .menu-item.active::before {
            content: "";
            position: absolute;
            left: 0;
            top: 20%;
            height: 60%;
            width: 4px;
            border-radius: 4px;
            background: #8bc34a;
        }

        .menu-item .m-icon {
            font-size: 1.25rem;
        }

        /* พื้นที่แสดงผลด้านขวา */
        .content {
            padding: 28px 32px;
        }

        .content.fade {
            animation: fadeIn 0.4s ease;
        }

        .breadcrumb {
            font-size: 0.85rem;
            font-weight: 300;
            color: #a5d6a7;
            margin-bottom: 10px;
        }

        .now-viewing {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: #dcedc8;
            background: rgba(139, 195, 74, 0.15);
            border: 1px solid rgba(139, 195, 74, 0.35);
            border-radius: 50px;
            padding: 4px 12px;
            margin-bottom: 14px;
        }

        .now-viewing .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #8bc34a;
            box-shadow: 0 0 8px #8bc34a;
        }

        .content h3 {
            font-size: 1.6rem;
            font-weight: 500;
            margin-bottom: 6px;
        }

        .content .desc {
            font-weight: 300;
            color: #c8e6c9;
            margin-bottom: 24px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 14px;
        }

        .stat {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(200, 230, 201, 0.1);
            border-radius: 18px;
            padding: 18px 20px;
        }

        .stat .s-icon {
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        .stat .s-label {
            font-size: 0.9rem;
            font-weight: 300;
            color: #a5d6a7;
        }

        .stat .s-value {
            font-size: 1.35rem;
            font-weight: 500;
            margin-top: 2px;
        }

        .note {
            margin-top: 22px;
            font-size: 0.85rem;
            font-weight: 300;
            color: rgba(200, 230, 201, 0.6);
        }

        /* มือถือ: เมนูย้ายไปด้านบนเป็นแถวเลื่อนได้ */
        @media (max-width: 760px) {
            .window-body {
                grid-template-columns: 1fr;
            }

            .sidebar {
                flex-direction: row;
                overflow-x: auto;
                padding: 12px;
                border-right: none;
                border-bottom: 1px solid rgba(200, 230, 201, 0.1);
            }

            .menu-item {
                white-space: nowrap;
                flex-shrink: 0;
            }

            .menu-item.active::before {
                left: 20%;
                top: auto;
                bottom: 0;
                width: 60%;
                height: 3px;
            }

            .content {
                padding: 22px 20px;
            }
        }
    </style>
</head>
<body>

    <!-- หน้าแรก -->
    <section id="home" class="screen active">
        <h1>🌿 Nature Innovation</h1>
        <p class="lead">เช็คสภาพอากาศและสภาพดินของแต่ละจังหวัดทั่วประเทศไทย</p>
        <button class="start-btn" id="startBtn">เริ่มต้นใช้งาน</button>
    </section>

    <!-- หน้าเลือกภูมิภาค -->
    <section id="regionScreen" class="screen">
        <div class="panel">
            <button class="back-btn" data-go="home">← กลับหน้าแรก</button>
            <h2>เลือกภูมิภาค</h2>
            <p class="subtitle">เลือกภาคที่ต้องการดูข้อมูล</p>
            <div class="grid" id="regionGrid"></div>
        </div>
    </section>

    <!-- หน้าเลือกจังหวัด -->
    <section id="provinceScreen" class="screen">
        <div class="panel">
            <button class="back-btn" data-go="regionScreen">← เลือกภาคอื่น</button>
            <h2 id="regionTitle"></h2>
            <p class="subtitle" id="regionSubtitle"></p>
            <input type="text" class="search" id="searchInput" placeholder="🔍 ค้นหาจังหวัด...">
            <div class="grid small" id="provinceGrid"></div>
            <p class="empty" id="emptyMsg">ไม่พบจังหวัดที่ค้นหา</p>
        </div>
    </section>

    <!-- หน้าต่างข้อมูลจังหวัด -->
    <section id="resultScreen" class="screen">
        <div class="panel wide">
            <button class="back-btn" data-go="provinceScreen">← เลือกจังหวัดอื่น</button>

            <div class="window">
                <div class="window-header">
                    <h2 id="provinceTitle"></h2>
                    <span class="region-tag" id="regionTag"></span>
                </div>

                <div class="window-body">
                    <nav class="sidebar" id="sidebar"></nav>
                    <div class="content" id="content"></div>
                </div>
            </div>
        </div>
    </section>

    <script>
        // ===== ข้อมูลภูมิภาคและจังหวัด (77 จังหวัด) =====
        const regions = [
            {
                name: "ภาคเหนือ", icon: "⛰️",
                provinces: ["เชียงราย", "เชียงใหม่", "น่าน", "พะเยา", "แพร่",
                            "แม่ฮ่องสอน", "ลำปาง", "ลำพูน", "อุตรดิตถ์"]
            },
            {
                name: "ภาคตะวันออกเฉียงเหนือ", icon: "🌾",
                provinces: ["กาฬสินธุ์", "ขอนแก่น", "ชัยภูมิ", "นครพนม", "นครราชสีมา",
                            "บึงกาฬ", "บุรีรัมย์", "มหาสารคาม", "มุกดาหาร", "ยโสธร",
                            "ร้อยเอ็ด", "เลย", "ศรีสะเกษ", "สกลนคร", "สุรินทร์",
                            "หนองคาย", "หนองบัวลำภู", "อำนาจเจริญ", "อุดรธานี", "อุบลราชธานี"]
            },
            {
                name: "ภาคกลาง", icon: "🏞️",
                provinces: ["กรุงเทพมหานคร", "กำแพงเพชร", "ชัยนาท", "นครนายก", "นครปฐม",
                            "นครสวรรค์", "นนทบุรี", "ปทุมธานี", "พระนครศรีอยุธยา", "พิจิตร",
                            "พิษณุโลก", "เพชรบูรณ์", "ลพบุรี", "สมุทรปราการ", "สมุทรสงคราม",
                            "สมุทรสาคร", "สระบุรี", "สิงห์บุรี", "สุโขทัย", "สุพรรณบุรี",
                            "อ่างทอง", "อุทัยธานี"]
            },
            {
                name: "ภาคตะวันออก", icon: "🌅",
                provinces: ["จันทบุรี", "ฉะเชิงเทรา", "ชลบุรี", "ตราด",
                            "ปราจีนบุรี", "ระยอง", "สระแก้ว"]
            },
            {
                name: "ภาคตะวันตก", icon: "🌲",
                provinces: ["กาญจนบุรี", "ตาก", "ประจวบคีรีขันธ์", "เพชรบุรี", "ราชบุรี"]
            },
            {
                name: "ภาคใต้", icon: "🏝️",
                provinces: ["กระบี่", "ชุมพร", "ตรัง", "นครศรีธรรมราช", "นราธิวาส",
                            "ปัตตานี", "พังงา", "พัทลุง", "ภูเก็ต", "ยะลา",
                            "ระนอง", "สงขลา", "สตูล", "สุราษฎร์ธานี"]
            }
        ];

        // ===== เมนูในหน้าต่างจังหวัด (เพิ่มเมนูใหม่ได้ที่นี่) =====
        const menus = [
            {
                id: "weather", icon: "🌤️", label: "สภาพอากาศ",
                desc: "สภาพอากาศปัจจุบันของพื้นที่",
                stats: () => [
                    ["🌡️", "อุณหภูมิ", "-- °C"],
                    ["💧", "ความชื้น", "-- %"],
                    ["🌧️", "โอกาสฝนตก", "-- %"],
                    ["🍃", "ความเร็วลม", "-- กม./ชม."]
                ]
            },
            {
                id: "soil", icon: "🌱", label: "สภาพดิน",
                desc: "ชนิดและคุณภาพของดินในจังหวัด",
                stats: () => [
                    ["🪨", "ชนิดดิน", "--"],
                    ["⚗️", "ค่า pH", "--"],
                    ["🌿", "ความอุดมสมบูรณ์", "--"],
                    ["💦", "การระบายน้ำ", "--"]
                ]
            },
            {
                id: "crops", icon: "🌾", label: "พืชที่เหมาะสม",
                desc: "พืชที่เหมาะกับดินและอากาศของพื้นที่",
                stats: () => [
                    ["🌾", "พืชไร่", "--"],
                    ["🍊", "ไม้ผล", "--"],
                    ["🥬", "พืชผัก", "--"]
                ]
            },
            {
                id: "water", icon: "💧", label: "แหล่งน้ำ",
                desc: "แม่น้ำ เขื่อน และแหล่งน้ำสำคัญ",
                stats: () => [
                    ["🏞️", "แม่น้ำสำคัญ", "--"],
                    ["🚧", "เขื่อน / อ่างเก็บน้ำ", "--"]
                ]
            },
            {
                id: "info", icon: "📍", label: "ข้อมูลทั่วไป",
                desc: "ข้อมูลพื้นฐานของจังหวัด",
                stats: (province, region) => [
                    ["🏙️", "จังหวัด", province],
                    ["🗺️", "ภูมิภาค", region.name]
                ]
            }
        ];

        let currentRegion = null;
        let currentProvince = null;

        // ===== สลับหน้าจอ =====
        function showScreen(id) {
            document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
            document.getElementById(id).classList.add("active");
            window.scrollTo(0, 0);
        }

        // ===== สร้างการ์ดภูมิภาค =====
        function renderRegions() {
            const grid = document.getElementById("regionGrid");
            grid.innerHTML = "";
            regions.forEach(region => {
                const card = document.createElement("button");
                card.className = "card";
                card.innerHTML = `
                    <div class="icon">${region.icon}</div>
                    <div class="name">${region.name}</div>
                    <div class="count">${region.provinces.length} จังหวัด</div>
                `;
                card.addEventListener("click", () => openRegion(region));
                grid.appendChild(card);
            });
        }

        // ===== เปิดหน้าจังหวัดของภาคที่เลือก =====
        function openRegion(region) {
            currentRegion = region;
            document.getElementById("regionTitle").textContent = region.icon + " " + region.name;
            document.getElementById("regionSubtitle").textContent =
                "เลือกจังหวัด (" + region.provinces.length + " จังหวัด)";
            document.getElementById("searchInput").value = "";
            renderProvinces("");
            showScreen("provinceScreen");
        }

        // ===== สร้างการ์ดจังหวัด (กรองตามคำค้นหา) =====
        function renderProvinces(keyword) {
            const grid = document.getElementById("provinceGrid");
            grid.innerHTML = "";

            const list = currentRegion.provinces
                .filter(p => p.includes(keyword.trim()))
                .sort((a, b) => a.localeCompare(b, "th"));

            list.forEach(name => {
                const card = document.createElement("button");
                card.className = "card province";
                card.textContent = name;
                card.addEventListener("click", () => selectProvince(name));
                grid.appendChild(card);
            });

            document.getElementById("emptyMsg").style.display = list.length ? "none" : "block";
        }

        // ===== เลือกจังหวัด → เปิดหน้าต่างข้อมูล =====
        function selectProvince(name) {
            currentProvince = name;
            document.getElementById("provinceTitle").textContent = "จังหวัด" + name;
            document.getElementById("regionTag").textContent = currentRegion.icon + " " + currentRegion.name;
            renderSidebar();
            openMenu("weather");
            showScreen("resultScreen");
        }

        // ===== สร้างเมนูด้านซ้าย =====
        function renderSidebar() {
            const sidebar = document.getElementById("sidebar");
            sidebar.innerHTML = "";
            menus.forEach(menu => {
                const item = document.createElement("button");
                item.className = "menu-item";
                item.dataset.id = menu.id;
                item.innerHTML = `<span class="m-icon">${menu.icon}</span><span>${menu.label}</span>`;
                item.addEventListener("click", () => openMenu(menu.id));
                sidebar.appendChild(item);
            });
        }

        // ===== แสดงผลด้านขวาตามเมนูที่เลือก =====
        function openMenu(id) {
            const menu = menus.find(m => m.id === id);

            // ไฮไลต์เมนูที่กำลังดูอยู่
            document.querySelectorAll(".menu-item").forEach(item => {
                item.classList.toggle("active", item.dataset.id === id);
            });

            const stats = menu.stats(currentProvince, currentRegion)
                .map(([icon, label, value]) => `
                    <div class="stat">
                        <div class="s-icon">${icon}</div>
                        <div class="s-label">${label}</div>
                        <div class="s-value">${value}</div>
                    </div>
                `).join("");

            const content = document.getElementById("content");
            content.innerHTML = `
                <div class="breadcrumb">จังหวัด${currentProvince} › ${menu.label}</div>
                <div class="now-viewing"><span class="dot"></span>กำลังดู</div>
                <h3>${menu.icon} ${menu.label}</h3>
                <p class="desc">${menu.desc}</p>
                <div class="stats">${stats}</div>
                ${id === "info" ? "" : '<p class="note">* ช่อง "--" จะแสดงข้อมูลจริงเมื่อเชื่อมต่อแหล่งข้อมูลแล้ว</p>'}
            `;

            // เล่นแอนิเมชันจางเข้าทุกครั้งที่เปลี่ยนเมนู
            content.classList.remove("fade");
            void content.offsetWidth;
            content.classList.add("fade");
        }

        // ===== ผูกปุ่มต่าง ๆ =====
        document.getElementById("startBtn").addEventListener("click", () => showScreen("regionScreen"));

        document.querySelectorAll("[data-go]").forEach(btn => {
            btn.addEventListener("click", () => showScreen(btn.dataset.go));
        });

        document.getElementById("searchInput").addEventListener("input", e => {
            renderProvinces(e.target.value);
        });

        renderRegions();
    </script>

</body>
</html>
