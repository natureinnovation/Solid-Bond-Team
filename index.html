        // =========================================================
        // 3) แหล่งข้อมูลจากภายนอก
        // =========================================================
        const GEO_BASE = "https://raw.githubusercontent.com/kongvut/thai-province-data/refs/heads/master/api/latest/";

        let geo = null;          // { provinces, districts, tambons }
        let geoPromise = null;

        // โหลดรายชื่อจังหวัด/อำเภอ/ตำบล (โหลดครั้งเดียวแล้วจำไว้)
        function loadGeo() {
            if (!geoPromise) {
                const files = ["province.json", "district.json", "sub_district.json"];
                geoPromise = Promise.all(files.map(f => fetchJSON(GEO_BASE + f)))
                    .then(([p, d, s]) => {
                        const alive = x => !x.deleted_at;
                        geo = {
                            provinces: p.filter(alive),
                            districts: d.filter(alive),
                            tambons: s.filter(alive)
                        };
                        return geo;
                    })
                    .catch(err => {
                        geoPromise = null; // ให้ลองใหม่ได้
                        throw err;
                    });
            }
            return geoPromise;
        }

        async function fetchJSON(url) {
            const res = await fetch(url);
            if (!res.ok) throw new Error("HTTP " + res.status);
            return res.json();
        }

        // ตัวช่วยอ่านชื่อจากชุดข้อมูล
        const thName = x => (x.name && x.name.th) || x.name_th || "";
        const enName = x => (x.name && x.name.en) || x.name_en || "";
        const prefixOf = (x, fallback) => (x.prefix && x.prefix.th) || fallback;

        function esc(text) {
            return String(text).replace(/[&<>"']/g, c => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
            })[c]);
        }

        function districtsOf(provinceId) {
            return geo.districts.filter(d => String(d.province_id) === String(provinceId));
        }

        function tambonsOf(districtId) {
            return geo.tambons.filter(t => String(t.district_id) === String(districtId));
        }

        // =========================================================
        // 4) สถานะการเลือก
        // =========================================================
        const state = {
            region: null,
            province: null,      // ชื่อจังหวัด (ภาษาไทย)
            provinceRec: null,   // ข้อมูลจังหวัดจากชุดข้อมูล
            district: null,
            tambon: null,
            level: "province",   // province | district | tambon
            locPromise: null,
            menu: null
        };

        function provinceTitle(name) {
            return name === "กรุงเทพมหานคร" ? name : "จังหวัด" + name;
        }

        function shortPrefix(prefix) {
            if (prefix === "อำเภอ") return "อ.";
            if (prefix === "ตำบล") return "ต.";
            return prefix;
        }

        // =========================================================
        // 5) สลับหน้าจอ
        // =========================================================
        function showScreen(id) {
            document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
            document.getElementById(id).classList.add("active");
            window.scrollTo(0, 0);
        }

        // =========================================================
        // 6) หน้าเลือกภูมิภาค
        // =========================================================
        function renderRegions() {
            const grid = document.getElementById("regionGrid");
            grid.innerHTML = "";
            regions.forEach(region => {
                const card = document.createElement("button");
                card.className = "card";
                card.innerHTML = `
                    <div class="icon">${region.icon}</div>
                    <div class="name">${region.name}</div>
                    <div class="count">${region.provinces.length} จังหวัด</div>
                `;
                card.addEventListener("click", () => openRegion(region));
                grid.appendChild(card);
            });
        }

        // =========================================================
        // 7) หน้ารายการ (ใช้ร่วมกันทั้งจังหวัด อำเภอ ตำบล)
        // =========================================================
        let listState = null;

        function showList(opts) {
            listState = opts;
            document.getElementById("listTitle").textContent = opts.title;
            document.getElementById("listSubtitle").textContent = opts.subtitle || "";
            document.getElementById("listBack").textContent = opts.backLabel || "← ย้อนกลับ";

            const actions = document.getElementById("listActions");
            actions.innerHTML = "";
            if (opts.skip) {
                const btn = document.createElement("button");
                btn.className = "skip-btn";
                btn.textContent = opts.skip.label;
                btn.addEventListener("click", opts.skip.fn);
                actions.appendChild(btn);
            }

            const search = document.getElementById("listSearch");
            search.value = "";
            search.placeholder = opts.searchPlaceholder || "🔍 พิมพ์เพื่อค้นหา...";
            search.style.display = opts.loading || opts.error ? "none" : "block";

            renderList("");
            showScreen("listScreen");
        }

        function renderList(keyword) {
            const grid = document.getElementById("listGrid");
            const msg = document.getElementById("listMsg");
            grid.innerHTML = "";
            msg.innerHTML = "";

            if (listState.loading) {
                msg.innerHTML = `<div class="loading"><span class="spinner"></span>${esc(listState.loading)}</div>`;
                return;
            }

            if (listState.error) {
                msg.innerHTML = `<div class="error-box">${esc(listState.error)}<br>
                    <button class="ghost-btn" id="retryBtn">ลองใหม่</button></div>`;
                document.getElementById("retryBtn").addEventListener("click", listState.retry);
                return;
            }

            const list = listState.items
                .filter(item => item.label.includes(keyword.trim()))
                .sort((a, b) => a.label.localeCompare(b.label, "th"));

            list.forEach(item => {
                const card = document.createElement("button");
                card.className = "card item";
                card.textContent = item.label;
                card.addEventListener("click", () => listState.onSelect(item.data));
                grid.appendChild(card);
            });

            if (!list.length) msg.textContent = "ไม่พบรายการที่ค้นหา";
        }

        // เลือกภาค → รายชื่อจังหวัด
        function openRegion(region) {
            state.region = region;
            showList({
                title: region.icon + " " + region.name,
                subtitle: "เลือกจังหวัด (" + region.provinces.length + " จังหวัด)",
                backLabel: "← เลือกภาคอื่น",
                back: () => showScreen("regionScreen"),
                searchPlaceholder: "🔍 ค้นหาจังหวัด...",
                items: region.provinces.map(p => ({ label: p, data: p })),
                onSelect: selectProvince
            });
        }

        // เลือกจังหวัด → รายชื่ออำเภอ
        async function selectProvince(name) {
            state.province = name;
            state.provinceRec = null;
            state.district = null;
            state.tambon = null;

            const isBkk = name === "กรุงเทพมหานคร";
            const word = isBkk ? "เขต" : "อำเภอ";
            const base = {
                title: provinceTitle(name),
                backLabel: "← เลือกจังหวัดอื่น",
                back: () => openRegion(state.region),
                skip: { label: "📍 ดูข้อมูลทั้งจังหวัด", fn: () => openDashboard("province") },
                searchPlaceholder: "🔍 ค้นหา" + word + "...",
                onSelect: selectDistrict
            };

            showList({ ...base, loading: "กำลังโหลดรายชื่อ" + word + "..." });

            try {
                await loadGeo();
            } catch (err) {
                if (state.province !== name) return;
                showList({
                    ...base,
                    error: "โหลดรายชื่อ" + word + "ไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่ หรือกดดูข้อมูลทั้งจังหวัดได้เลย",
                    retry: () => selectProvince(name)
                });
                return;
            }

            if (state.province !== name) return; // ผู้ใช้กดไปหน้าอื่นแล้ว

            const rec = geo.provinces.find(p => thName(p) === name);
            if (!rec) {
                showList({ ...base, error: "ไม่พบรายชื่อ" + word + "ของจังหวัดนี้", retry: () => selectProvince(name) });
                return;
            }

            state.provinceRec = rec;
            const districts = districtsOf(rec.id);
            showList({
                ...base,
                subtitle: "เลือก" + word + " (" + districts.length + " " + word + ")",
                items: districts.map(d => ({ label: thName(d), data: d }))
            });
        }

        // เลือกอำเภอ → รายชื่อตำบล
        function selectDistrict(district) {
            state.district = district;
            state.tambon = null;

            const dPrefix = prefixOf(district, "อำเภอ");
            const tambons = tambonsOf(district.id);
            const tWord = tambons.length ? prefixOf(tambons[0], "ตำบล") : "ตำบล";

            showList({
                title: dPrefix + thName(district),
                subtitle: provinceTitle(state.province) + " · เลือก" + tWord + " (" + tambons.length + " " + tWord + ")",
                backLabel: "← เลือก" + dPrefix + "อื่น",
                back: () => selectProvince(state.province),
                skip: { label: "📍 ดูข้อมูลทั้ง" + dPrefix, fn: () => openDashboard("district") },
                searchPlaceholder: "🔍 ค้นหา" + tWord + "...",
                items: tambons.map(t => ({ label: thName(t), data: t })),
                onSelect: selectTambon
            });
        }

        // เลือกตำบล → เปิดหน้าต่างข้อมูล
        function selectTambon(tambon) {
            state.tambon = tambon;
            openDashboard("tambon");
        }

        // =========================================================
        // 8) หาพิกัดของพื้นที่ที่เลือก
        // =========================================================
        function coordOf(t) {
            const lat = parseFloat(t.lat);
            const lon = parseFloat(t.long ?? t.lng ?? t.lon);
            const ok = isFinite(lat) && isFinite(lon) && lat > 5 && lat < 21 && lon > 97 && lon < 106;
            return ok ? { lat, lon } : null;
        }

        function averageCoord(tambons) {
            const list = tambons.map(coordOf).filter(Boolean);
            if (!list.length) return null;
            return {
                lat: list.reduce((s, c) => s + c.lat, 0) / list.length,
                lon: list.reduce((s, c) => s + c.lon, 0) / list.length
            };
        }

        async function geocodeProvince() {
            const rec = state.provinceRec;
            const query = rec ? enName(rec) : state.province;
            const lang = rec ? "en" : "th";
            const url = "https://geocoding-api.open-meteo.com/v1/search?count=1&countryCode=TH&language=" +
                lang + "&name=" + encodeURIComponent(query);
            const data = await fetchJSON(url);
            if (!data.results || !data.results.length) return null;
            return { lat: data.results[0].latitude, lon: data.results[0].longitude };
        }

        async function resolveLocation() {
            let c = null;
            let approx = false;

            if (state.level === "tambon" && state.tambon) {
                c = coordOf(state.tambon);
                if (!c) approx = true;
            }

            if (!c && state.district) {
                c = averageCoord(tambonsOf(state.district.id));
            }

            if (!c && state.provinceRec) {
                const ids = new Set(districtsOf(state.provinceRec.id).map(d => String(d.id)));
                c = averageCoord(geo.tambons.filter(t => ids.has(String(t.district_id))));
                if (state.level !== "province") approx = true;
            }

            if (!c) {
                c = await geocodeProvince();
                if (state.level !== "province") approx = true;
            }

            if (!c) throw new Error("ไม่พบพิกัดของพื้นที่นี้");
            return { ...c, approx };
        }

        // =========================================================
        // 9) ดึงสภาพอากาศและค่าฝุ่นจาก Open-Meteo
        // =========================================================
        // อัปเดตข้อมูลอากาศและค่าฝุ่นทุก 20 นาที
        const REFRESH_MS = 20 * 60 * 1000;
        const apiCache = {};

        // จำผลไว้ ถ้าเก่ากว่า 20 นาทีจะดึงใหม่
        function cached(key, loader) {
            const hit = apiCache[key];
            if (!hit || Date.now() - hit.time > REFRESH_MS - 30 * 1000) {
                const entry = { time: Date.now() };
                entry.promise = loader()
                    .then(data => {
                        data._fetchedAt = Date.now();
                        return data;
                    })
                    .catch(err => {
                        if (apiCache[key] === entry) delete apiCache[key];
                        throw err;
                    });
                apiCache[key] = entry;
            }
            return apiCache[key].promise;
        }

        function clockTime(ms) {
            const d = new Date(ms);
            return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0") + " น.";
        }

        function liveNote(data) {
            return "🔄 อัปเดตอัตโนมัติทุก 20 นาที · ดึงข้อมูลล่าสุดเมื่อ " + clockTime(data._fetchedAt) + "<br>";
        }

        function getWeather(loc) {
            const url = "https://api.open-meteo.com/v1/forecast" +
                "?latitude=" + loc.lat.toFixed(4) + "&longitude=" + loc.lon.toFixed(4) +
                "&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m" +
                "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max" +
                "&timezone=Asia%2FBangkok&forecast_days=5";
            return cached(url, () => fetchJSON(url));
        }

        function getAir(loc) {
            const url = "https://air-quality-api.open-meteo.com/v1/air-quality" +
                "?latitude=" + loc.lat.toFixed(4) + "&longitude=" + loc.lon.toFixed(4) +
                "&current=pm2_5,pm10&timezone=Asia%2FBangkok";
            return cached(url, () => fetchJSON(url));
        }

        // รหัสสภาพอากาศ → ไอคอนและคำอธิบาย
        function weatherText(code) {
            if (code === 0) return ["☀️", "ท้องฟ้าแจ่มใส"];
            if (code === 1) return ["🌤️", "มีเมฆเล็กน้อย"];
            if (code === 2) return ["⛅", "มีเมฆบางส่วน"];
            if (code === 3) return ["☁️", "เมฆมาก"];
            if (code === 45 || code === 48) return ["🌫️", "มีหมอก"];
            if (code >= 51 && code <= 57) return ["🌦️", "ฝนปรอย"];
            if (code === 61 || code === 66) return ["🌧️", "ฝนตกเล็กน้อย"];
            if (code === 63) return ["🌧️", "ฝนตกปานกลาง"];
            if (code === 65 || code === 67) return ["🌧️", "ฝนตกหนัก"];
            if (code >= 71 && code <= 77) return ["❄️", "หิมะ"];
            if (code === 80) return ["🌦️", "ฝนตกเป็นช่วง ๆ"];
            if (code === 81) return ["🌧️", "ฝนตกเป็นช่วง ๆ ปานกลาง"];
            if (code === 82) return ["⛈️", "ฝนตกหนักเป็นช่วง ๆ"];
            if (code >= 95) return ["⛈️", "พายุฝนฟ้าคะนอง"];
            return ["🌡️", "ไม่ทราบสภาพอากาศ"];
        }

        // เกณฑ์ PM2.5 ของประเทศไทย
        function pmLevel(pm) {
            if (pm <= 15)   return { text: "คุณภาพอากาศดีมาก", color: "#4fc3f7", tip: "เหมาะกับกิจกรรมกลางแจ้งและการท่องเที่ยว" };
            if (pm <= 25)   return { text: "คุณภาพอากาศดี", color: "#66bb6a", tip: "ทำกิจกรรมกลางแจ้งได้ตามปกติ" };
            if (pm <= 37.5) return { text: "ปานกลาง", color: "#ffee58", tip: "ผู้ที่ต้องดูแลสุขภาพเป็นพิเศษควรลดกิจกรรมกลางแจ้ง" };
            if (pm <= 75)   return { text: "เริ่มมีผลกระทบต่อสุขภาพ", color: "#ffa726", tip: "ควรสวมหน้ากากป้องกันฝุ่นและลดเวลาอยู่กลางแจ้ง" };
            return { text: "มีผลกระทบต่อสุขภาพ", color: "#ef5350", tip: "ควรงดกิจกรรมกลางแจ้งและสวมหน้ากากป้องกันฝุ่น" };
        }

        function formatTime(iso) {
            return iso ? iso.split("T")[1] + " น." : "-";
        }

        function dayName(dateStr, index) {
            if (index === 0) return "วันนี้";
            const d = new Date(dateStr + "T00:00:00");
            return d.toLocaleDateString("th-TH", { weekday: "short", day: "numeric", month: "short" });
        }

        const SOURCE_NOTE = 'ข้อมูลจาก <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a> (CC BY 4.0)';
        const STATIC_NOTE = "* ข้อมูลนี้เป็นภาพรวมระดับภาค ควรตรวจสอบรายละเอียดของพื้นที่กับกรมพัฒนาที่ดินอีกครั้ง";

        function approxNote(loc) {
            return loc.approx ? "<br>* ไม่มีพิกัดของพื้นที่นี้โดยตรง จึงใช้พิกัดของพื้นที่ใกล้เคียงแทน" : "";
        }

        function statsHTML(list, isText) {
            return `<div class="stats${isText ? " text" : ""}">` + list.map(([icon, label, value]) => `
                <div class="stat">
                    <div class="s-icon">${icon}</div>
                    <div class="s-label">${esc(label)}</div>
                    <div class="s-value">${esc(value)}</div>
                </div>`).join("") + "</div>";
        }

        // =========================================================
        // 10) เมนูในหน้าต่างข้อมูล (เพิ่มเมนูใหม่ได้ที่นี่)
        // =========================================================
        const menus = [
            {
                id: "weather", icon: "🌤️", label: "สภาพอากาศ", live: true,
                desc: "สภาพอากาศตอนนี้และพยากรณ์ 5 วัน",
                async render() {
                    const loc = await state.locPromise;
                    const w = await getWeather(loc);
                    const c = w.current;
                    const d = w.daily;
                    const [icon, text] = weatherText(c.weather_code);

                    const days = d.time.map((date, i) => {
                        const [dIcon] = weatherText(d.weather_code[i]);
                        return `
                            <div class="day">
                                <div class="d-name">${dayName(date, i)}</div>
                                <div class="d-icon">${dIcon}</div>
                                <div class="d-temp">${Math.round(d.temperature_2m_max[i])}° / ${Math.round(d.temperature_2m_min[i])}°</div>
                                <div class="d-rain">🌧️ ${d.precipitation_probability_max[i] ?? "-"}%</div>
                            </div>`;
                    }).join("");

                    return `
                        <div class="hero">
                            <div class="h-icon">${icon}</div>
                            <div>
                                <div class="h-temp">${Math.round(c.temperature_2m)}°C</div>
                                <div class="h-text">${text}</div>
                                <div class="h-sub">รู้สึกเหมือน ${Math.round(c.apparent_temperature)}°C · อัปเดต ${formatTime(c.time)}</div>
                            </div>
                        </div>
                        ${statsHTML([
                            ["💧", "ความชื้น", c.relative_humidity_2m + " %"],
                            ["🌧️", "โอกาสฝนตกวันนี้", (d.precipitation_probability_max[0] ?? "-") + " %"],
                            ["☔", "ปริมาณฝนตอนนี้", c.precipitation + " มม."],
                            ["🍃", "ความเร็วลม", Math.round(c.wind_speed_10m) + " กม./ชม."],
                            ["🔆", "ดัชนี UV สูงสุดวันนี้", d.uv_index_max[0] ?? "-"]
                        ])}
                        <div class="section-title">พยากรณ์ 5 วัน</div>
                        <div class="forecast">${days}</div>
                        <p class="note">${liveNote(w)}${SOURCE_NOTE}${approxNote(loc)}</p>
                    `;
                }
            },
            {
                id: "air", icon: "😷", label: "คุณภาพอากาศ", live: true,
                desc: "ค่าฝุ่น PM2.5 และ PM10 ตอนนี้",
                async render() {
                    const loc = await state.locPromise;
                    const a = await getAir(loc);
                    const pm25 = a.current.pm2_5;
                    const lv = pmLevel(pm25);

                    return `
                        <div class="hero">
                            <div class="h-icon">😷</div>
                            <div>
                                <div class="h-sub">PM2.5 (ไมโครกรัม/ลบ.ม.)</div>
                                <div class="h-temp">${Math.round(pm25)}</div>
                                <span class="aqi-badge" style="background:${lv.color}">${lv.text}</span>
                            </div>
                        </div>
                        ${statsHTML([
                            ["🌫️", "PM10", Math.round(a.current.pm10) + " มคก./ลบ.ม."],
                            ["💡", "คำแนะนำ", lv.tip],
                            ["🕒", "อัปเดต", formatTime(a.current.time)]
                        ])}
                        <p class="note">${liveNote(a)}${SOURCE_NOTE} · เป็นค่าประมาณจากแบบจำลอง
                            ดูค่าจากสถานีตรวจวัดจริงได้ที่ <a href="https://air4thai.pcd.go.th/" target="_blank" rel="noopener">Air4Thai</a>${approxNote(loc)}</p>
                    `;
                }
            },
            {
                id: "soil", icon: "🌱", label: "สภาพดิน",
                desc: "ลักษณะและคุณภาพของดินในพื้นที่",
                render() {
                    return statsHTML(regionInfo[state.region.key].soil, true) +
                        `<p class="note">${STATIC_NOTE}</p>`;
                }
            },
            {
                id: "crops", icon: "🌾", label: "พืชที่เหมาะสม",
                desc: "พืชที่นิยมปลูกและเหมาะกับดินและอากาศของพื้นที่",
                render() {
                    return statsHTML(regionInfo[state.region.key].crops, true) +
                        `<p class="note">${STATIC_NOTE}</p>`;
                }
            },
            {
                id: "water", icon: "💧", label: "แหล่งน้ำ",
                desc: "แม่น้ำ เขื่อน และแหล่งน้ำสำคัญของภาค",
                render() {
                    return statsHTML(regionInfo[state.region.key].water, true) +
                        `<p class="note">* ข้อมูลภาพรวมระดับภาค</p>`;
                }
            },
            {
                id: "info", icon: "📍", label: "ข้อมูลทั่วไป",
                desc: "ข้อมูลพื้นฐานของพื้นที่ที่เลือก",
                async render() {
                    const list = [
                        ["🗺️", "ภูมิภาค", state.region.name],
                        ["🏙️", "จังหวัด", state.province]
                    ];
                    if (state.district) {
                        list.push(["🏘️", prefixOf(state.district, "อำเภอ"), thName(state.district)]);
                    }
                    if (state.tambon) {
                        list.push(["🏡", prefixOf(state.tambon, "ตำบล"), thName(state.tambon)]);
                        if (state.tambon.zip_code) list.push(["📮", "รหัสไปรษณีย์", state.tambon.zip_code]);
                    }
                    try {
                        const loc = await state.locPromise;
                        list.push(["🧭", "พิกัด", loc.lat.toFixed(4) + ", " + loc.lon.toFixed(4)]);
                    } catch (e) {
                        // ไม่มีพิกัดก็ไม่เป็นไร
                    }
                    return statsHTML(list);
                }
            }
        ];

        // =========================================================
        // 11) หน้าต่างข้อมูล
        // =========================================================
        // mode = "screen" (หน้าต่างเต็มหน้า) หรือ "map" (กรอบขวาข้างแผนที่)
        function openDashboard(level, mode = "screen") {
            state.level = level;
            if (level === "province") {
                state.district = null;
                state.tambon = null;
            }
            if (level === "district") {
                state.tambon = null;
            }

            // หัวหน้าต่าง: ชื่อจังหวัด + เส้นทางอำเภอ/ตำบล
            document.getElementById("provinceTitle").textContent = provinceTitle(state.province);
            const path = [];
            if (state.district) path.push(shortPrefix(prefixOf(state.district, "อำเภอ")) + thName(state.district));
            if (state.tambon) path.push(shortPrefix(prefixOf(state.tambon, "ตำบล")) + thName(state.tambon));
            document.getElementById("placePath").textContent = path.join(" › ");
            document.getElementById("regionTag").textContent = state.region.icon + " " + state.region.name;

            state.locPromise = resolveLocation();
            state.locPromise.catch(() => {}); // กัน error ค้าง ถ้ายังไม่มีเมนูไหนรอใช้

            const win = document.getElementById("infoWindow");
            renderSidebar();
            openMenu(mode === "map" && state.menu ? state.menu : "weather");

            if (mode === "map") {
                // ย้ายหน้าต่างข้อมูลไปไว้กรอบขวาของแผนที่
                document.getElementById("infoPane").appendChild(win);
                win.classList.add("compact");
                openSplit();
                return;
            }

            // ย้ายหน้าต่างข้อมูลกลับมาหน้าเต็ม
            document.getElementById("resultPanel").appendChild(win);
            win.classList.remove("compact");

            // ปุ่มย้อนกลับไปหน้ารายการที่มา
            const backBtn = document.getElementById("resultBack");
            if (level === "province") {
                backBtn.textContent = "← กลับไปเลือกอำเภอ";
                backBtn.onclick = () => selectProvince(state.province);
            } else {
                const district = state.district;
                backBtn.textContent = "← กลับไปเลือกตำบล";
                backBtn.onclick = () => selectDistrict(district);
            }

            showScreen("resultScreen");
        }

        // =========================================================
        // 12) แผนที่ประเทศไทย
        // =========================================================
        let map = null;
        let markerLayer = null;
        let mapMarkers = {};      // id → marker (ใช้ไฮไลต์หมุดที่เลือก)
        let mapLevel = "country"; // country | province | district
        let idx = null;           // ดัชนีข้อมูลสำหรับแผนที่

        const THAI_CENTER = [13.2, 101.0];

        function regionOf(provinceName) {
            return regions.find(r => r.provinces.includes(provinceName));
        }

        // สร้างดัชนีครั้งเดียว: อำเภอของแต่ละจังหวัด ตำบลของแต่ละอำเภอ และพิกัดกลาง
        function buildIndex() {
            if (idx) return idx;
            idx = { provinceByName: {}, districtsByProvince: {}, tambonsByDistrict: {}, coord: {} };

            geo.tambons.forEach(t => {
                const key = String(t.district_id);
                (idx.tambonsByDistrict[key] = idx.tambonsByDistrict[key] || []).push(t);
            });

            geo.districts.forEach(d => {
                const key = String(d.province_id);
                (idx.districtsByProvince[key] = idx.districtsByProvince[key] || []).push(d);
                idx.coord["d" + d.id] = averageCoord(idx.tambonsByDistrict[String(d.id)] || []);
            });

            geo.provinces.forEach(p => {
                idx.provinceByName[thName(p)] = p;
                const tambons = (idx.districtsByProvince[String(p.id)] || [])
                    .flatMap(d => idx.tambonsByDistrict[String(d.id)] || []);
                idx.coord["p" + p.id] = averageCoord(tambons);
            });

            return idx;
        }

        function initMap() {
            if (map) return;
            map = L.map("map", { zoomControl: true }).setView(THAI_CENTER, 6);
            L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
            }).addTo(map);
            markerLayer = L.layerGroup().addTo(map);
        }

        // หมุดรูปลูกศรชี้ลง
        function pinIcon(color, size) {
            return L.divIcon({
                className: "pin-wrap",
                html: `<div class="pin" style="--c:${color}"></div>`,
                iconSize: [size, size],
                iconAnchor: [size / 2, size * 1.2]
            });
        }

        function addPin(id, coord, color, size, label, onClick) {
            const marker = L.marker([coord.lat, coord.lon], { icon: pinIcon(color, size) })
                .bindTooltip(label, { direction: "top", offset: [0, -size], className: "map-tip" })
                .on("click", onClick)
                .addTo(markerLayer);
            mapMarkers[id] = marker;
            return marker;
        }

        function clearPins() {
            markerLayer.clearLayers();
            mapMarkers = {};
        }

        function highlightPin(id) {
            Object.entries(mapMarkers).forEach(([key, m]) => {
                const el = m.getElement();
                if (el) el.classList.toggle("selected", key === id);
            });
        }

        function fitTo(coords, maxZoom) {
            if (!coords.length) return;
            if (coords.length === 1) {
                map.flyTo([coords[0].lat, coords[0].lon], maxZoom, { duration: 0.8 });
                return;
            }
            const bounds = L.latLngBounds(coords.map(c => [c.lat, c.lon]));
            map.flyToBounds(bounds, { padding: [60, 60], maxZoom, duration: 0.8 });
        }

        // แผงควบคุมบนแผนที่: คำแนะนำ + รายชื่อแบบเลือก + ปุ่มดูทั้งพื้นที่
        function setMapControls(hint, items, onPick, skip) {
            document.getElementById("mapHint").textContent = hint;

            const select = document.getElementById("mapSelect");
            select.innerHTML = '<option value="">— หรือเลือกจากรายชื่อ —</option>';
            items.slice()
                .sort((a, b) => a.label.localeCompare(b.label, "th"))
                .forEach((item, i) => {
                    const opt = document.createElement("option");
                    opt.value = item.key;
                    opt.textContent = item.label;
                    select.appendChild(opt);
                });
            select.onchange = () => {
                const item = items.find(it => it.key === select.value);
                if (item) onPick(item.data);
                select.value = "";
            };

            const skipBtn = document.getElementById("mapSkip");
            skipBtn.style.display = skip ? "inline-block" : "none";
            if (skip) {
                skipBtn.textContent = skip.label;
                skipBtn.onclick = skip.fn;
            }
        }

        function setLegend(show) {
            const legend = document.getElementById("mapLegend");
            legend.innerHTML = show
                ? regions.map(r => `<span><i style="background:${r.color}"></i>${r.name}</span>`).join("")
                : "";
        }

        // แถบบอกตำแหน่ง: ประเทศไทย › จังหวัด › อำเภอ › ตำบล (กดย้อนได้)
        function setCrumb() {
            const crumb = document.getElementById("mapCrumb");
            crumb.innerHTML = "";
            const parts = [{ label: "🇹🇭 ประเทศไทย", fn: showCountry }];
            if (state.province) parts.push({ label: provinceTitle(state.province), fn: () => mapProvince(state.province) });
            if (state.district) {
                const d = state.district;
                parts.push({ label: prefixOf(d, "อำเภอ") + thName(d), fn: () => mapDistrict(d) });
            }
            if (state.tambon) parts.push({ label: prefixOf(state.tambon, "ตำบล") + thName(state.tambon) });

            parts.forEach((p, i) => {
                if (i > 0) crumb.appendChild(document.createTextNode(" › "));
                const isLast = i === parts.length - 1;
                if (isLast || !p.fn) {
                    const span = document.createElement("span");
                    span.className = "current";
                    span.textContent = p.label;
                    crumb.appendChild(span);
                } else {
                    const btn = document.createElement("button");
                    btn.textContent = p.label;
                    btn.addEventListener("click", p.fn);
                    crumb.appendChild(btn);
                }
            });
        }

        function setMapLoading(html) {
            const box = document.getElementById("mapLoading");
            box.innerHTML = html || "";
            box.classList.toggle("hidden", !html);
        }

        // เปิด/ปิดกรอบข้อมูลด้านขวา
        function openSplit() {
            const layout = document.getElementById("mapLayout");
            const wasOpen = layout.classList.contains("split");
            layout.classList.add("split");
            refreshMapSize();
            if (!wasOpen && window.innerWidth <= 860) {
                setTimeout(() => document.getElementById("infoPane").scrollIntoView({ behavior: "smooth" }), 300);
            }
        }

        function closeSplit() {
            document.getElementById("mapLayout").classList.remove("split");
            refreshMapSize();
        }

        function refreshMapSize() {
            if (!map) return;

        function pad2(n) {
            return String(n).padStart(2, "0");
        }

        // วันที่แบบ yyyy-mm-dd นับจากวันนี้ (+ ไปข้างหน้า, - ย้อนหลัง)
        function dateStr(offsetDays) {
            const d = new Date(Date.now() + offsetDays * 86400000);
            return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
        }

        function thDate(value) {
            return new Date(value).toLocaleDateString("th-TH", { day: "numeric", month: "short", year: "2-digit" });
        }

        function fmtNum(n) {
            if (n == null || !isFinite(n)) return "-";
            return n >= 100 ? Math.round(n).toLocaleString("th-TH") : n.toFixed(1);
        }

        // จุดกลางของทุกจังหวัด
        function riskPoints() {
            const pts = [];
            regions.forEach(region => {
                region.provinces.forEach(name => {
                    const rec = idx.provinceByName[name];
                    const c = rec && idx.coord["p" + rec.id];
                    if (c) pts.push({ id: name, name, region, lat: c.lat, lon: c.lon });
                });
            });
            return pts;
        }

        function multiUrl(base, pts, extra) {
            return base +
                "?latitude=" + pts.map(p => p.lat.toFixed(3)).join(",") +
                "&longitude=" + pts.map(p => p.lon.toFixed(3)).join(",") + extra;
        }

        function asArray(json) {
            return Array.isArray(json) ? json : [json];
        }

        // ----- ดินถล่ม: ฝนรายวัน 5 วัน (ย้อนหลัง 2 วัน + วันนี้ + ล่วงหน้า 2 วัน) -----
        async function loadLandslide() {
            const pts = riskPoints();
            const url = multiUrl("https://api.open-meteo.com/v1/forecast", pts,
                "&daily=precipitation_sum&past_days=2&forecast_days=3&timezone=Asia%2FBangkok");
            const raw = await cached(url, () => fetchJSON(url));
            const data = asArray(raw);

            const items = pts.map((p, i) => {
                const daily = data[i] && data[i].daily;
                if (!daily) return { ...p, level: -1, sub: "ไม่มีข้อมูลฝน", details: [] };

                const rain = daily.precipitation_sum.map(v => v || 0);
                const max24 = Math.max(...rain);
                let acc3 = 0;
                for (let j = 0; j + 2 < rain.length; j++) {
                    acc3 = Math.max(acc3, rain[j] + rain[j + 1] + rain[j + 2]);
                }

                const prone = LANDSLIDE_PRONE.has(p.name);
                let level = 0;
                if (max24 >= 150 || acc3 >= 250) level = 3;
                else if (max24 >= 100 || acc3 >= 150) level = 2;
                else if (max24 >= 60 || acc3 >= 90) level = 1;
                if (!prone) level = Math.min(level, 1); // พื้นที่ราบ ดินถล่มเกิดยาก

                const perDay = daily.time.map((t, j) =>
                    new Date(t + "T00:00:00").toLocaleDateString("th-TH", { day: "numeric", month: "short" }) +
                    " " + fmtNum(rain[j]) + " มม.").join(" · ");

                return {
                    ...p,
                    level,
                    sub: "ฝนสูงสุด " + fmtNum(max24) + " มม./วัน · สะสม 3 วัน " + fmtNum(acc3) + " มม.",
                    details: [
                        "🌧️ ฝนสูงสุดใน 1 วัน: " + fmtNum(max24) + " มม.",
                        "💧 ฝนสะสม 3 วันติดกันสูงสุด: " + fmtNum(acc3) + " มม.",
                        "📅 ฝนรายวัน: " + perDay,
                        prone ? "⛰️ มีพื้นที่ภูเขาที่เคยถูกเตือนภัยดินถล่ม" : "🏞️ ส่วนใหญ่เป็นพื้นที่ราบ โอกาสเกิดดินถล่มต่ำ"
                    ]
                };
            });

            return { items, fetchedAt: raw._fetchedAt };
        }

        // ----- น้ำท่วม: ปริมาณน้ำในแม่น้ำ 1 ปีย้อนหลัง + พยากรณ์ 7 วัน -----
        async function loadFlood() {
            const pts = riskPoints();
            const today = dateStr(0);
            const url = multiUrl("https://flood-api.open-meteo.com/v1/flood", pts,
                "&daily=river_discharge&start_date=" + dateStr(-365) + "&end_date=" + dateStr(7));
            const raw = await cached(url, () => fetchJSON(url));
            const data = asArray(raw);

            const items = pts.map((p, i) => {
                const daily = data[i] && data[i].daily;
                const none = { ...p, level: -1, sub: "ไม่พบแม่น้ำในแบบจำลองใกล้ตัวจังหวัด", details: [] };
                if (!daily || !daily.river_discharge) return none;

                const past = [];
                const future = [];
                daily.time.forEach((t, j) => {
                    const v = daily.river_discharge[j];
                    if (v == null) return;
                    (t < today ? past : future).push(v);
                });
                if (past.length < 30 || !future.length) return none;

                const sorted = past.slice().sort((a, b) => a - b);
                const p90 = sorted[Math.floor(0.9 * (sorted.length - 1))];
                const maxPast = sorted[sorted.length - 1];
                const now = future[0];
                const peak = Math.max(...future);

                let level = 0;
                if (peak > maxPast * 1.2) level = 3;
                else if (peak > maxPast) level = 2;
                else if (peak > p90) level = 1;

                let trend = "ทรงตัว";
                if (peak > now * 1.1) trend = "มีแนวโน้มเพิ่มขึ้น ⬆️";
                else if (future[future.length - 1] < now * 0.9) trend = "มีแนวโน้มลดลง ⬇️";

                return {
                    ...p,
                    level,
                    sub: "น้ำวันนี้ " + fmtNum(now) + " · สูงสุด 7 วัน " + fmtNum(peak) + " ม³/วินาที",
                    details: [
                        "🌊 ปริมาณน้ำในแม่น้ำวันนี้: " + fmtNum(now) + " ลูกบาศก์เมตร/วินาที",
                        "📈 สูงสุดใน 7 วันข้างหน้า: " + fmtNum(peak) + " ลูกบาศก์เมตร/วินาที (" + trend + ")",
                        "📊 ระดับน้ำสูง (สูงสุด 10%) ของปีที่ผ่านมา: " + fmtNum(p90),
                        "🔝 สูงสุดในรอบปีที่ผ่านมา: " + fmtNum(maxPast)
                    ]
                };
            });

            return { items, fetchedAt: raw._fetchedAt };
        }

        // ----- เหตุการณ์ที่เกิดขึ้นแล้ว: GDACS + แผ่นดินไหวจาก USGS -----
        function nearThailand(lat, lon) {
            return lat > 5 && lat < 21 && lon > 97 && lon < 106;
        }

        async function loadEvents() {
            const from = dateStr(-60);
            const to = dateStr(0);
            const gdacsUrl = "https://www.gdacs.org/gdacsapi/api/events/geteventlist/SEARCH" +
                "?eventlist=FL;TC;DR;WF;VO&fromdate=" + from + "&todate=" + to +
                "&alertlevel=green;orange;red&country=Thailand";
            const usgsUrl = "https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson" +
                "&starttime=" + from + "&minlatitude=5&maxlatitude=21&minlongitude=97&maxlongitude=106" +
                "&minmagnitude=2.5&orderby=time";

            const [g, u] = await Promise.allSettled([
                cached(gdacsUrl, () => fetchJSON(gdacsUrl)),
                cached(usgsUrl, () => fetchJSON(usgsUrl))
            ]);

            const items = [];
            const errors = [];

            if (g.status === "fulfilled") {
                (g.value.features || []).forEach(f => {
                    const pr = f.properties || {};
                    const coords = f.geometry && f.geometry.type === "Point" ? f.geometry.coordinates : null;
                    const lat = coords ? coords[1] : null;
                    const lon = coords ? coords[0] : null;
                    const isThai = String(pr.iso3 || "").includes("THA") ||
                        String(pr.country || "").includes("Thailand") ||
                        (lat != null && nearThailand(lat, lon));
                    if (!isThai) return;

                    const type = EVENT_TYPES[pr.eventtype] || { icon: "⚠️", label: pr.eventtype, color: "#bdbdbd" };
                    items.push({
                        id: "g" + pr.eventtype + pr.eventid,
                        name: type.icon + " " + (pr.name || type.label),
                        lat, lon,
                        color: type.color,
                        badge: type.label,
                        time: new Date(pr.fromdate).getTime() || 0,
                        sub: thDate(pr.fromdate) + (pr.todate ? " – " + thDate(pr.todate) : "") +
                            (pr.country ? " · " + pr.country : ""),
                        details: [
                            "📅 ช่วงเวลา: " + thDate(pr.fromdate) + (pr.todate ? " ถึง " + thDate(pr.todate) : ""),
                            "🚨 ระดับการแจ้งเตือน: " + (ALERT_TH[pr.alertlevel] || pr.alertlevel || "-"),
                            pr.description ? "📝 " + pr.description : ""
                        ].filter(Boolean),
                        link: pr.url && pr.url.report ? pr.url.report : null
                    });
                });
            } else {
                errors.push("ดึงข้อมูลน้ำท่วม พายุ ภัยแล้ง และไฟป่าจาก GDACS ไม่ได้ในตอนนี้");
            }

            if (u.status === "fulfilled") {
                (u.value.features || []).forEach(f => {
                    const pr = f.properties || {};
                    const [lon, lat, depth] = f.geometry.coordinates;
                    items.push({
                        id: "u" + f.id,
                        name: "🌍 แผ่นดินไหว ขนาด " + (pr.mag != null ? pr.mag.toFixed(1) : "-"),
                        lat, lon,
                        color: EVENT_TYPES.EQ.color,
                        badge: "แผ่นดินไหว",
                        time: pr.time,
                        sub: thDate(pr.time) + " · " + (pr.place || ""),
                        details: [
                            "📅 วันเวลา: " + new Date(pr.time).toLocaleString("th-TH"),
                            "📏 ขนาด: " + (pr.mag != null ? pr.mag.toFixed(1) : "-"),
                            "⬇️ ความลึก: " + fmtNum(depth) + " กม.",
                            "📍 บริเวณ: " + (pr.place || "-")
                        ],
                        link: pr.url || null
                    });
                });
            } else {
                errors.push("ดึงข้อมูลแผ่นดินไหวจาก USGS ไม่ได้ในตอนนี้");
            }

            if (g.status === "rejected" && u.status === "rejected") throw new Error("events");

            items.sort((a, b) => b.time - a.time);
            return { items, errors, fetchedAt: Date.now() };
        }

        // ----- แผนที่ของหน้าภัยธรรมชาติ -----
        function initRiskMap() {
            if (RISK.map) return;
            RISK.map = L.map("riskMap", { zoomControl: true }).setView(THAI_CENTER, 6);
            L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
            }).addTo(RISK.map);
            RISK.layer = L.layerGroup().addTo(RISK.map);
        }

        function setRiskLoading(html) {
            const box = document.getElementById("riskLoading");
            box.innerHTML = html || "";
            box.classList.toggle("hidden", !html);
        }

        function itemColor(item) {
            return item.color || levelInfo(item.level).color;
        }

        function itemBadge(item) {
            return item.badge || levelInfo(item.level).label;
        }

        function drawRiskMap() {
            RISK.layer.clearLayers();
            RISK.markers = {};
            RISK.items.forEach(item => {
                if (item.lat == null) return;
                const size = item.level >= 2 ? 22 : 17;
                const marker = L.marker([item.lat, item.lon], { icon: pinIcon(itemColor(item), size) })
                    .bindTooltip(item.name + " · " + itemBadge(item), { direction: "top", offset: [0, -size], className: "map-tip" })
                    .on("click", () => selectRiskItem(item.id, false))
                    .addTo(RISK.layer);
                RISK.markers[item.id] = marker;
            });

            const legend = document.getElementById("riskLegend");
            if (RISK.tab === "events") {
                const used = Object.values(EVENT_TYPES).filter(t => RISK.items.some(i => i.badge === t.label));
                legend.innerHTML = used.map(t => `<span><i style="background:${t.color}"></i>${t.label}</span>`).join("");
            } else {
                const list = RISK_LEVELS.slice();
                if (RISK.tab === "flood") list.push(NO_DATA);
                legend.innerHTML = list.map(l => `<span><i style="background:${l.color}"></i>${l.label}</span>`).join("");
            }
        }

        function drawRiskPanel() {
            const tab = RISK_TABS[RISK.tab];
            const items = RISK.items;
            let html = `<h3>${tab.title}</h3><p class="desc">${tab.desc}</p>`;

            // สรุปจำนวนแต่ละระดับ
            if (RISK.tab !== "events") {
                const counts = {};
                items.forEach(i => { counts[i.level] = (counts[i.level] || 0) + 1; });
                html += '<div class="level-chips">' + [3, 2, 1, 0, -1]
                    .filter(l => counts[l])
                    .map(l => `<span class="level-chip"><span class="lv-dot" style="background:${levelInfo(l).color}"></span>${levelInfo(l).label} ${counts[l]} จังหวัด</span>`)
                    .join("") + "</div>";
            }

            (RISK.meta.errors || []).forEach(e => {
                html += `<p class="note" style="color:#ffb74d">⚠️ ${esc(e)}</p>`;
            });

            // รายละเอียดของรายการที่เลือก
            const sel = items.find(i => i.id === RISK.selected);
            if (sel) {
                html += `<div class="risk-detail">
                    <h4>${esc(sel.name)} <span class="level-badge" style="background:${itemColor(sel)}">${esc(itemBadge(sel))}</span></h4>
                    <ul>${sel.details.map(d => `<li>${esc(d)}</li>`).join("")}</ul>
                    ${RISK.tab === "events"
                        ? (sel.link ? `<a href="${esc(sel.link)}" target="_blank" rel="noopener">อ่านรายงานฉบับเต็ม →</a>` : "")
                        : `<button class="skip-btn" data-goto="${esc(sel.name)}">📍 ดูข้อมูลพื้นที่ของจังหวัดนี้</button>`}
                </div>`;
            }

            // รายการทั้งหมด (เสี่ยงมากอยู่บน)
            if (!items.length) {
                html += `<div class="risk-empty">ไม่พบเหตุการณ์ในประเทศไทยช่วง 60 วันที่ผ่านมา 🌿</div>`;
            } else {
                const list = RISK.tab === "events" ? items
                    : items.slice().sort((a, b) => b.level - a.level || a.name.localeCompare(b.name, "th"));
                html += '<div class="risk-list">' + list.map(i => `
                    <button class="risk-row${i.id === RISK.selected ? " selected" : ""}" data-id="${esc(i.id)}">
                        <span class="lv-dot" style="background:${itemColor(i)}"></span>
                        <span class="r-main">
                            <div class="r-name">${esc(i.name)}</div>
                            <div class="r-sub">${esc(i.sub)}</div>
                        </span>
                        <span class="level-badge" style="background:${itemColor(i)}">${esc(itemBadge(i))}</span>
                    </button>`).join("") + "</div>";
            }

            // แหล่งข้อมูล
            const sources = {
                landslide: 'ข้อมูลฝนจาก <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a> · ' +
                    'ประกาศเตือนภัยทางการดูได้ที่ <a href="https://www.dmr.go.th/" target="_blank" rel="noopener">กรมทรัพยากรธรณี</a>',
                flood: 'ข้อมูลแม่น้ำจากแบบจำลอง GloFAS ผ่าน <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a> · ' +
                    'ดูระดับน้ำจริงจากสถานีที่ <a href="https://www.thaiwater.net/" target="_blank" rel="noopener">ThaiWater</a>',
                events: 'ข้อมูลจาก <a href="https://www.gdacs.org/" target="_blank" rel="noopener">GDACS</a> และ ' +
                    '<a href="https://earthquake.usgs.gov/" target="_blank" rel="noopener">USGS</a>'
            };
            const disclaimer = RISK.tab === "events"
                ? "* ข้อมูลภัยขนาดเล็กหรือเหตุการณ์เฉพาะพื้นที่อาจไม่ปรากฏในรายการนี้"
                : "* เป็นการประเมินเบื้องต้นจากข้อมูลแบบจำลอง ไม่ใช่ประกาศเตือนภัยอย่างเป็นทางการ";
            html += `<p class="note">${liveNote({ _fetchedAt: RISK.meta.fetchedAt })}${sources[RISK.tab]}<br>${disclaimer}</p>`;

            document.getElementById("riskPanel").innerHTML = html;
        }

        function selectRiskItem(id, fromList) {
            RISK.selected = id;
            Object.entries(RISK.markers).forEach(([key, m]) => {
                const el = m.getElement();
                if (el) el.classList.toggle("selected", key === id);
            });
            const item = RISK.items.find(i => i.id === id);
            if (item && item.lat != null && fromList) {
                RISK.map.flyTo([item.lat, item.lon], Math.max(RISK.map.getZoom(), 8), { duration: 0.6 });
            }
            drawRiskPanel();
            document.getElementById("riskPanel").scrollTop = 0;
        }

        async function renderRiskTab(silent) {
            const tabKey = RISK.tab;
            const token = ++RISK.token;

            if (!silent) {
                RISK.selected = null;
                setRiskLoading('<div class="loading"><span class="spinner"></span>กำลังโหลดข้อมูล...</div>');
                document.getElementById("riskPanel").innerHTML =
                    `<h3>${RISK_TABS[tabKey].title}</h3><div class="loading"><span class="spinner"></span>กำลังประเมินทุกจังหวัด...</div>`;
            }

            try {
                if (tabKey !== "events") {
                    await loadGeo();
                    buildIndex();
                }
                const result = tabKey === "landslide" ? await loadLandslide()
                    : tabKey === "flood" ? await loadFlood()
                    : await loadEvents();

                if (token !== RISK.token) return;
                RISK.items = result.items;
                RISK.meta = result;
                setRiskLoading("");
                drawRiskMap();
                drawRiskPanel();
                if (RISK.selected) selectRiskItem(RISK.selected, false);
                RISK.renderedAt = Date.now();
            } catch (err) {
                if (token !== RISK.token || silent) return;
                setRiskLoading(`<div class="error-box">โหลดข้อมูลไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่<br>
                    <button class="ghost-btn" id="riskRetry">ลองใหม่</button></div>`);
                document.getElementById("riskRetry").addEventListener("click", () => renderRiskTab(false));
                document.getElementById("riskPanel").innerHTML =
                    `<h3>${RISK_TABS[tabKey].title}</h3><div class="risk-empty">ยังโหลดข้อมูลไม่ได้</div>`;
            }
        }

        function switchRiskTab(tab) {
            RISK.tab = tab;
            document.querySelectorAll("#riskTabs button").forEach(b => {
                b.classList.toggle("active", b.dataset.tab === tab);
            });
            renderRiskTab(false);
        }

        function openDisaster() {
            showScreen("disasterScreen");
            initRiskMap();
            [100, 400].forEach(ms => setTimeout(() => RISK.map.invalidateSize(), ms));
            RISK.map.setView(THAI_CENTER, 6);
            switchRiskTab(RISK.tab);
        }

        // ไปหน้าข้อมูลพื้นที่ของจังหวัดที่เลือก
        function goToProvince(name) {
            state.region = regionOf(name);
            selectProvince(name);
        }

        document.getElementById("riskPanel").addEventListener("click", e => {
            const go = e.target.closest("[data-goto]");
            if (go) return goToProvince(go.dataset.goto);
            const row = e.target.closest("[data-id]");
            if (row) selectRiskItem(row.dataset.id, true);
        });

        document.querySelectorAll("#riskTabs button").forEach(b => {
            b.addEventListener("click", () => switchRiskTab(b.dataset.tab));
        });

        document.getElementById("disasterBtn").addEventListener("click", () => {
            openDisaster();
            loadGeo().catch(() => {});
        });

        document.getElementById("disasterBack").addEventListener("click", () => showScreen("home"));

        // =========================================================
        // 13) ผูกปุ่มต่าง ๆ
        // =========================================================
        document.getElementById("mapEntry").addEventListener("click", openMap);
        document.getElementById("mapBack").addEventListener("click", mapBack);

        document.getElementById("startBtn").addEventListener("click", () => {
            showScreen("regionScreen");
            loadGeo().catch(() => {}); // เริ่มโหลดรายชื่ออำเภอ/ตำบลไว้ล่วงหน้า
        });

        document.getElementById("regionBack").addEventListener("click", () => showScreen("home"));

        document.getElementById("listBack").addEventListener("click", () => {
            if (listState && listState.back) listState.back();
        });

        document.getElementById("listSearch").addEventListener("input", e => {
            renderList(e.target.value);
        });

        // ===== สวิตช์โหมดมืด/สว่าง =====
        function setTheme(theme) {
            document.documentElement.classList.toggle("light", theme === "light");
            try {
                localStorage.setItem("theme", theme);
            } catch (e) {}
            updateThemeSwitch();
        }

        // ไฮไลต์ปุ่มของโหมดที่ใช้อยู่ตอนนี้
        function updateThemeSwitch() {
            const current = document.documentElement.classList.contains("light") ? "light" : "dark";
            document.querySelectorAll(".theme-switch button").forEach(btn => {
                btn.classList.toggle("active", btn.dataset.theme === current);
            });
        }

        document.querySelectorAll(".theme-switch button").forEach(btn => {
            btn.addEventListener("click", () => setTheme(btn.dataset.theme));
        });

        updateThemeSwitch();
        renderRegions();
    </script>

</body>
</html>
