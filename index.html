<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature Innovation</title>
    <!-- โหมดสว่าง/มืด: โหลดค่าที่เคยเลือกไว้ก่อนแสดงหน้าเว็บ จะได้ไม่กระพริบ -->
    <meta name="color-scheme" content="light dark">
    <script>
        try {
            if (localStorage.getItem("theme") === "light") document.documentElement.classList.add("light");
        } catch (e) {}
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            background: #000000;
        }

        body {
            min-height: 100vh;
            font-family: "Prompt", sans-serif;
            color: #e8f5e9;

            /* พื้นหลังไล่สีดำ-เขียว ขยับช้า ๆ */
            background: linear-gradient(to top,
                #000000 0%, #0b2414 20%, #1f5130 40%, #2e6b3f 50%,
                #1f5130 60%, #0b2414 80%, #000000 100%);
            background-size: 100% 200%;
            background-attachment: fixed;
            animation: bgMove 10s ease-in-out infinite alternate;
        }

        @keyframes bgMove {
            0%   { background-position: 50% 100%; }
            100% { background-position: 50% 50%; }
        }

        a {
            color: #aed581;
        }

        /* ===== ระบบหน้าจอ ===== */
        .screen {
            display: none;
            min-height: 100vh;
            padding: 48px 20px;
            flex-direction: column;
            align-items: center;
        }

        .screen.active {
            display: flex;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .panel {
            width: 100%;
            max-width: 900px;
        }

        .panel.wide {
            max-width: 1100px;
        }

        /* ===== หน้าแรก ===== */
        #home {
            justify-content: center;
            text-align: center;
            gap: 40px;
        }

        h1 {
            font-size: clamp(2rem, 6vw, 3.5rem);
            font-weight: 600;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }

        .lead {
            font-size: clamp(1rem, 3vw, 1.2rem);
            font-weight: 300;
            color: #c8e6c9;
            max-width: 520px;
            line-height: 1.7;
        }

        .start-btn {
            font-family: inherit;
            font-size: 1.25rem;
            font-weight: 500;
            color: #ffffff;
            padding: 18px 56px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            background: linear-gradient(to bottom, #6a9f4e, #4a7c36);
            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.55),
                0 25px 60px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.25);
            transition: background 0.3s, box-shadow 0.3s;
        }

        .start-btn:hover {
            background: linear-gradient(to bottom, #7cb35c, #558b3f);
            box-shadow:
                0 15px 35px rgba(0, 0, 0, 0.6),
                0 35px 80px rgba(0, 0, 0, 0.7),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .start-btn:active {
            transform: translateY(2px);
        }

        /* ===== ปุ่มทั่วไป ===== */
        .back-btn,
        .ghost-btn {
            font-family: inherit;
            font-size: 0.95rem;
            color: #c8e6c9;
            background: transparent;
            border: 1px solid rgba(200, 230, 201, 0.25);
            border-radius: 50px;
            padding: 8px 20px;
            cursor: pointer;
            transition: background 0.25s, border-color 0.25s;
        }

        .back-btn {
            margin-bottom: 28px;
        }

        .back-btn:hover,
        .ghost-btn:hover {
            background: rgba(106, 159, 78, 0.15);
            border-color: rgba(124, 179, 92, 0.6);
        }

        .skip-btn {
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 500;
            color: #ffffff;
            background: linear-gradient(to bottom, #6a9f4e, #4a7c36);
            border: none;
            border-radius: 50px;
            padding: 10px 22px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
            transition: background 0.25s;
        }

        .skip-btn:hover {
            background: linear-gradient(to bottom, #7cb35c, #558b3f);
        }

        h2 {
            font-size: clamp(1.6rem, 4vw, 2.2rem);
            font-weight: 500;
            margin-bottom: 8px;
        }

        .subtitle {
            font-weight: 300;
            color: #a5d6a7;
            margin-bottom: 20px;
        }

        .list-actions {
            margin-bottom: 20px;
        }

        .list-actions:empty {
            display: none;
        }

        /* ===== การ์ด ===== */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 16px;
        }

        .grid.small {
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 12px;
        }

        .card {
            font-family: inherit;
            color: inherit;
            text-align: left;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(200, 230, 201, 0.12);
            border-radius: 20px;
            padding: 24px;
            cursor: pointer;
            backdrop-filter: blur(6px);
            transition: transform 0.25s, background 0.25s, border-color 0.25s, box-shadow 0.25s;
        }

        .card:hover {
            transform: translateY(-4px);
            background: rgba(106, 159, 78, 0.15);
            border-color: rgba(124, 179, 92, 0.5);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.45);
        }

        .card .icon {
            font-size: 2rem;
            margin-bottom: 12px;
        }

        .card .name {
            font-size: 1.2rem;
            font-weight: 500;
        }

        .card .count {
            font-size: 0.9rem;
            font-weight: 300;
            color: #a5d6a7;
            margin-top: 4px;
        }

        .card.item {
            text-align: center;
            padding: 16px 12px;
            font-size: 1rem;
            border-radius: 16px;
        }

        /* ===== ช่องค้นหา ===== */
        .search {
            width: 100%;
            font-family: inherit;
            font-size: 1rem;
            color: #e8f5e9;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(200, 230, 201, 0.2);
            border-radius: 50px;
            padding: 14px 22px;
            margin-bottom: 24px;
            outline: none;
            transition: border-color 0.25s;
        }

        .search::placeholder {
            color: rgba(200, 230, 201, 0.5);
        }

        .search:focus {
            border-color: rgba(124, 179, 92, 0.7);
        }

        .list-msg {
            text-align: center;
            color: #a5d6a7;
            font-weight: 300;
            padding: 30px 0;
            line-height: 1.8;
        }

        .list-msg:empty {
            display: none;
        }

        /* ===== ตัวหมุนตอนโหลด ===== */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #a5d6a7;
            font-weight: 300;
            padding: 40px 0;
        }

        .spinner {
            width: 22px;
            height: 22px;
            border: 3px solid rgba(165, 214, 167, 0.25);
            border-top-color: #8bc34a;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== หน้าต่างข้อมูล ===== */
        .window {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(200, 230, 201, 0.12);
            border-radius: 24px;
            overflow: hidden;
            backdrop-filter: blur(8px);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
        }

        .window-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            padding: 22px 28px;
            background: rgba(106, 159, 78, 0.12);
            border-bottom: 1px solid rgba(200, 230, 201, 0.12);
        }

        .window-header h2 {
            margin: 0;
        }

        .place-path {
            font-weight: 300;
            color: #c8e6c9;
            margin-top: 4px;
        }

        .place-path:empty {
            display: none;
        }

        .region-tag {
            font-size: 0.85rem;
            color: #a5d6a7;
            border: 1px solid rgba(165, 214, 167, 0.3);
            border-radius: 50px;
            padding: 4px 14px;
        }

        .window-body {
            display: grid;
            grid-template-columns: 240px 1fr;
            min-height: 480px;
        }

        /* เมนูด้านซ้าย */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 20px 14px;
            border-right: 1px solid rgba(200, 230, 201, 0.1);
        }

        .menu-item {
            position: relative;
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: inherit;
            font-size: 1rem;
            color: #c8e6c9;
            text-align: left;
            background: transparent;
            border: none;
            border-radius: 14px;
            padding: 13px 16px;
            cursor: pointer;
            transition: background 0.25s, color 0.25s;
        }

        .menu-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
        }

        .menu-item.active {
            background: rgba(106, 159, 78, 0.22);
            color: #ffffff;
            font-weight: 500;
        }

        .menu-item.active::before {
            content: "";
            position: absolute;
            left: 0;
            top: 20%;
            height: 60%;
            width: 4px;
            border-radius: 4px;
            background: #8bc34a;
        }

        .menu-item .m-icon {
            font-size: 1.25rem;
        }

        /* พื้นที่แสดงผลด้านขวา */
        .content {
            padding: 28px 32px;
            min-width: 0;
        }

        .content.fade {
            animation: fadeIn 0.4s ease;
        }

        .breadcrumb {
            font-size: 0.85rem;
            font-weight: 300;
            color: #a5d6a7;
            margin-bottom: 10px;
        }

        .now-viewing {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: #dcedc8;
            background: rgba(139, 195, 74, 0.15);
            border: 1px solid rgba(139, 195, 74, 0.35);
            border-radius: 50px;
            padding: 4px 12px;
            margin-bottom: 14px;
        }

        .now-viewing .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #8bc34a;
            box-shadow: 0 0 8px #8bc34a;
        }

        .content h3 {
            font-size: 1.6rem;
            font-weight: 500;
            margin-bottom: 6px;
        }

        .content .desc {
            font-weight: 300;
            color: #c8e6c9;
            margin-bottom: 24px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 14px;
        }

        .stat {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(200, 230, 201, 0.1);
            border-radius: 18px;
            padding: 18px 20px;
        }

        .stat .s-icon {
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        .stat .s-label {
            font-size: 0.9rem;
            font-weight: 300;
            color: #a5d6a7;
        }

        .stat .s-value {
            font-size: 1.2rem;
            font-weight: 500;
            margin-top: 2px;
            line-height: 1.5;
        }

        .stats.text .s-value {
            font-size: 1rem;
            font-weight: 400;
        }

        /* สภาพอากาศตอนนี้ (กล่องใหญ่) */
        .hero {
            display: flex;
            align-items: center;
            gap: 22px;
            flex-wrap: wrap;
            background: rgba(106, 159, 78, 0.12);
            border: 1px solid rgba(139, 195, 74, 0.25);
            border-radius: 20px;
            padding: 22px 26px;
            margin-bottom: 16px;
        }

        .hero .h-icon {
            font-size: 3.5rem;
        }

        .hero .h-temp {
            font-size: 3rem;
            font-weight: 500;
            line-height: 1;
        }

        .hero .h-text {
            font-size: 1.1rem;
            margin-top: 6px;
        }

        .hero .h-sub {
            font-weight: 300;
            color: #c8e6c9;
            font-size: 0.9rem;
        }

        /* พยากรณ์ 5 วัน */
        .section-title {
            font-size: 1.05rem;
            font-weight: 500;
            margin: 26px 0 12px;
        }

        .forecast {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
        }

        .day {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(200, 230, 201, 0.1);
            border-radius: 16px;
            padding: 14px 8px;
        }

        .day .d-name {
            font-size: 0.85rem;
            color: #a5d6a7;
        }

        .day .d-icon {
            font-size: 1.8rem;
            margin: 6px 0;
        }

        .day .d-temp {
            font-weight: 500;
        }

        .day .d-rain {
            font-size: 0.8rem;
            font-weight: 300;
            color: #c8e6c9;
            margin-top: 2px;
        }

        /* ค่าฝุ่น */
        .aqi-badge {
            display: inline-block;
            font-size: 0.9rem;
            font-weight: 500;
            color: #1b1b1b;
            border-radius: 50px;
            padding: 4px 14px;
            margin-top: 8px;
        }

        .note {
            margin-top: 22px;
            font-size: 0.85rem;
            font-weight: 300;
            color: rgba(200, 230, 201, 0.7);
            line-height: 1.7;
        }

        .error-box {
            text-align: center;
            padding: 30px 0;
            color: #ffcc80;
            font-weight: 300;
            line-height: 1.8;
        }

        .error-box .ghost-btn {
            margin-top: 14px;
        }

        /* ===== ปุ่มแผนที่ (แถบยาวในหน้าเลือกภาค) ===== */
        .map-card {
            display: flex;
            align-items: center;
            gap: 18px;
            width: 100%;
            margin-bottom: 16px;
            background: linear-gradient(to right, rgba(106, 159, 78, 0.25), rgba(255, 255, 255, 0.05));
            border-color: rgba(139, 195, 74, 0.35);
        }

        .map-card .icon {
            margin-bottom: 0;
            font-size: 2.4rem;
        }

        .map-card .arrow {
            margin-left: auto;
            font-size: 1.5rem;
            color: #aed581;
            transition: transform 0.25s;
        }

        .map-card:hover .arrow {
            transform: translateX(6px);
        }

        /* ===== หน้าแผนที่ ===== */
        .map-wrap {
            width: 100%;
            max-width: 1300px;
        }

        .map-top {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .map-top .back-btn {
            margin-bottom: 0;
        }

        .map-crumb {
            font-weight: 300;
            color: #c8e6c9;
        }

        .map-crumb button {
            font-family: inherit;
            font-size: 1rem;
            color: #aed581;
            background: none;
            border: none;
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .map-crumb .current {
            color: #ffffff;
            font-weight: 500;
        }

        /* สองกรอบ: แผนที่ซ้าย ข้อมูลขวา (ตอนแรกมีแค่แผนที่) */
        .map-layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 0fr);
            gap: 0;
            align-items: start;
            transition: grid-template-columns 0.6s ease, gap 0.6s ease;
        }

        .map-layout.split {
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 20px;
        }

        .map-pane {
            position: sticky;
            top: 20px;
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid rgba(200, 230, 201, 0.15);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
        }

        #map {
            height: 75vh;
            min-height: 420px;
            background: #0b1a10;
        }

        .info-pane {
            min-width: 0;
            overflow: hidden;
            opacity: 0;
            transform: translateX(40px);
            transition: opacity 0.5s ease 0.2s, transform 0.5s ease 0.2s;
        }

        .map-layout.split .info-pane {
            opacity: 1;
            transform: translateX(0);
            overflow: visible;
        }

        /* แผงควบคุมลอยบนแผนที่ */
        .map-overlay {
            position: absolute;
            top: 14px;
            left: 60px;
            right: 14px;
            z-index: 500;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            pointer-events: none;
        }

        .map-overlay > * {
            pointer-events: auto;
        }

        .map-hint {
            font-size: 0.9rem;
            color: #e8f5e9;
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid rgba(200, 230, 201, 0.2);
            border-radius: 50px;
            padding: 8px 16px;
            backdrop-filter: blur(6px);
        }

        .map-select {
            font-family: inherit;
            font-size: 0.9rem;
            color: #e8f5e9;
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid rgba(200, 230, 201, 0.25);
            border-radius: 50px;
            padding: 8px 14px;
            max-width: 220px;
            outline: none;
            cursor: pointer;
        }

        .map-select option {
            background: #10261a;
        }

        .map-overlay .skip-btn {
            padding: 8px 18px;
        }

        .legend {
            position: absolute;
            left: 14px;
            bottom: 24px;
            z-index: 500;
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 0.8rem;
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid rgba(200, 230, 201, 0.2);
            border-radius: 14px;
            padding: 10px 14px;
            backdrop-filter: blur(6px);
        }

        .legend:empty {
            display: none;
        }

        .legend span {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend i {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.8);
        }

        .map-loading {
            position: absolute;
            inset: 0;
            z-index: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.55);
            text-align: center;
        }

        .map-loading.hidden {
            display: none;
        }

        /* หมุดลูกศรบนแผนที่ */
        .pin-wrap {
            background: none;
            border: none;
        }

        .pin {
            position: relative;
            width: 100%;
            height: 100%;
            background: var(--c);
            border: 2px solid rgba(255, 255, 255, 0.9);
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .pin::after {
            content: "";
            position: absolute;
            top: 30%;
            left: 30%;
            width: 40%;
            height: 40%;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.35);
        }

        .pin-wrap:hover .pin {
            transform: rotate(-45deg) scale(1.2);
        }

        .pin-wrap.selected .pin {
            transform: rotate(-45deg) scale(1.4);
            border-color: #ffffff;
            box-shadow: 0 0 0 5px rgba(255, 255, 255, 0.25), 0 6px 14px rgba(0, 0, 0, 0.7);
        }

        .leaflet-tooltip.map-tip {
            font-family: "Prompt", sans-serif;
            color: #e8f5e9;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(200, 230, 201, 0.25);
            border-radius: 10px;
            box-shadow: none;
        }

        .leaflet-tooltip.map-tip::before {
            display: none;
        }

        .leaflet-container {
            font-family: "Prompt", sans-serif;
        }

        /* ทำให้แผนที่เป็นโทนมืด เข้ากับธีม */
        .leaflet-tile-pane {
            filter: invert(1) hue-rotate(180deg) brightness(0.95) contrast(0.9) saturate(0.6);
        }

        /* หน้าต่างข้อมูลแบบกะทัดรัด (ตอนอยู่ข้างแผนที่) */
        .window.compact .window-body {
            grid-template-columns: 1fr;
            min-height: 0;
        }

        .window.compact .sidebar {
            flex-direction: row;
            overflow-x: auto;
            padding: 12px;
            border-right: none;
            border-bottom: 1px solid rgba(200, 230, 201, 0.1);
        }

        .window.compact .menu-item {
            white-space: nowrap;
            flex-shrink: 0;
        }

        .window.compact .menu-item.active::before {
            left: 20%;
            top: auto;
            bottom: 0;
            width: 60%;
            height: 3px;
        }

        .window.compact .content {
            padding: 22px 22px;
        }

        .window.compact .forecast {
            grid-template-columns: repeat(auto-fill, minmax(95px, 1fr));
        }

        /* แผนที่บนจอเล็ก: ข้อมูลขึ้นใต้แผนที่ */
        @media (max-width: 860px) {
            .map-layout,
            .map-layout.split {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .info-pane {
                display: none;
            }

            .map-layout.split .info-pane {
                display: block;
            }

            .map-pane {
                position: relative;
                top: 0;
            }

            #map {
                height: 55vh;
                min-height: 320px;
            }

            .map-overlay {
                left: 56px;
            }
        }

        /* มือถือ: เมนูย้ายไปด้านบนเป็นแถวเลื่อนได้ */
        @media (max-width: 760px) {
            .window-body {
                grid-template-columns: 1fr;
            }

            .sidebar {
                flex-direction: row;
                overflow-x: auto;
                padding: 12px;
                border-right: none;
                border-bottom: 1px solid rgba(200, 230, 201, 0.1);
            }

            .menu-item {
                white-space: nowrap;
                flex-shrink: 0;
            }

            .menu-item.active::before {
                left: 20%;
                top: auto;
                bottom: 0;
                width: 60%;
                height: 3px;
            }

            .content {
                padding: 22px 18px;
            }
        }

        /* =========================================================
           สวิตช์โหมด + โหมดสว่าง
           ========================================================= */
        html {
            color-scheme: dark;
        }

        html.light {
            color-scheme: light;
            background: #f1f8e9;
        }

        /* สวิตช์สองฝั่ง: มืด | สว่าง (ฝั่งที่เป็นสีเขียวคือโหมดที่ใช้อยู่) */
        .theme-switch {
            position: fixed;
            top: 14px;
            right: 14px;
            z-index: 2000;
            display: flex;
            gap: 4px;
            padding: 4px;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(200, 230, 201, 0.3);
            border-radius: 50px;
            backdrop-filter: blur(8px);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
        }

        .theme-switch button {
            font-family: inherit;
            font-size: 0.85rem;
            color: #c8e6c9;
            background: transparent;
            border: none;
            border-radius: 50px;
            padding: 6px 14px;
            cursor: pointer;
            transition: background 0.25s, color 0.25s;
        }

        .theme-switch button.active {
            color: #ffffff;
            font-weight: 500;
            background: linear-gradient(to bottom, #6a9f4e, #4a7c36);
        }

        html.light .theme-switch {
            background: rgba(255, 255, 255, 0.8);
            border-color: rgba(46, 125, 50, 0.3);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
        }

        html.light .theme-switch button {
            color: #2e5d34;
        }

        html.light .theme-switch button.active {
            color: #ffffff;
        }

        /* พื้นหลังสว่าง: ไล่สีเขียวอ่อน ยังขยับได้เหมือนเดิม */
        html.light body {
            color: #1b3a24;
            background: linear-gradient(to top,
                #f9fbe7 0%, #e8f5e9 20%, #c8e6c9 40%, #aed581 50%,
                #c8e6c9 60%, #e8f5e9 80%, #f9fbe7 100%);
            background-size: 100% 200%;
            background-attachment: fixed;
        }

        html.light a {
            color: #33691e;
        }

        html.light h1 {
            text-shadow: 0 4px 16px rgba(255, 255, 255, 0.6);
        }

        html.light .lead,
        html.light .subtitle,
        html.light .card .count,
        html.light .place-path,
        html.light .breadcrumb,
        html.light .content .desc,
        html.light .stat .s-label,
        html.light .day .d-name,
        html.light .day .d-rain,
        html.light .hero .h-sub,
        html.light .list-msg,
        html.light .loading,
        html.light .map-crumb {
            color: #4e6e52;
        }

        html.light .note {
            color: #5f7d63;
        }

        html.light .start-btn {
            box-shadow:
                0 10px 25px rgba(27, 58, 36, 0.25),
                0 25px 60px rgba(27, 58, 36, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        html.light .back-btn,
        html.light .ghost-btn {
            color: #2e5d34;
            border-color: rgba(46, 125, 50, 0.35);
        }

        html.light .back-btn:hover,
        html.light .ghost-btn:hover {
            background: rgba(139, 195, 74, 0.2);
        }

        html.light .skip-btn {
            box-shadow: 0 6px 16px rgba(27, 58, 36, 0.2);
        }

        html.light .card {
            background: rgba(255, 255, 255, 0.7);
            border-color: rgba(46, 125, 50, 0.15);
        }

        html.light .card:hover {
            background: rgba(220, 237, 200, 0.9);
            border-color: rgba(85, 139, 47, 0.5);
            box-shadow: 0 15px 35px rgba(27, 58, 36, 0.15);
        }

        html.light .map-card {
            background: linear-gradient(to right, rgba(174, 213, 129, 0.6), rgba(255, 255, 255, 0.7));
            border-color: rgba(85, 139, 47, 0.4);
        }

        html.light .map-card .arrow {
            color: #558b2f;
        }

        html.light .search {
            color: #1b3a24;
            background: rgba(255, 255, 255, 0.8);
            border-color: rgba(46, 125, 50, 0.25);
        }

        html.light .search::placeholder {
            color: rgba(46, 93, 52, 0.5);
        }

        html.light .spinner {
            border-color: rgba(85, 139, 47, 0.2);
            border-top-color: #558b2f;
        }

        html.light .error-box {
            color: #e65100;
        }

        /* หน้าต่างข้อมูล */
        html.light .window {
            background: rgba(255, 255, 255, 0.75);
            border-color: rgba(46, 125, 50, 0.15);
            box-shadow: 0 25px 60px rgba(27, 58, 36, 0.15);
        }

        html.light .window-header {
            background: rgba(174, 213, 129, 0.3);
            border-bottom-color: rgba(46, 125, 50, 0.15);
        }

        html.light .region-tag {
            color: #33691e;
            border-color: rgba(85, 139, 47, 0.4);
        }

        html.light .sidebar {
            border-color: rgba(46, 125, 50, 0.12);
        }

        html.light .menu-item {
            color: #2e5d34;
        }

        html.light .menu-item:hover {
            background: rgba(0, 0, 0, 0.04);
            color: #1b3a24;
        }

        html.light .menu-item.active {
            background: rgba(174, 213, 129, 0.45);
            color: #1b3a24;
        }

        html.light .menu-item.active::before {
            background: #558b2f;
        }

        html.light .now-viewing {
            color: #33691e;
            background: rgba(139, 195, 74, 0.2);
            border-color: rgba(85, 139, 47, 0.4);
        }

        html.light .now-viewing .dot {
            background: #558b2f;
            box-shadow: 0 0 8px #8bc34a;
        }

        html.light .stat,
        html.light .day {
            background: rgba(255, 255, 255, 0.85);
            border-color: rgba(46, 125, 50, 0.12);
        }

        html.light .hero {
            background: rgba(174, 213, 129, 0.3);
            border-color: rgba(85, 139, 47, 0.3);
        }

        /* แผนที่โหมดสว่าง: ใช้สีแผนที่ปกติ */
        html.light #map {
            background: #e8eee4;
        }

        html.light .leaflet-tile-pane {
            filter: none;
        }

        html.light .map-pane {
            border-color: rgba(46, 125, 50, 0.2);
            box-shadow: 0 25px 60px rgba(27, 58, 36, 0.15);
        }

        html.light .map-crumb button {
            color: #33691e;
        }

        html.light .map-crumb .current {
            color: #1b3a24;
        }

        html.light .map-hint,
        html.light .map-select,
        html.light .legend {
            color: #1b3a24;
            background: rgba(255, 255, 255, 0.88);
            border-color: rgba(46, 125, 50, 0.25);
        }

        html.light .map-select option {
            background: #ffffff;
        }

        html.light .map-loading {
            background: rgba(255, 255, 255, 0.6);
        }

        html.light .leaflet-tooltip.map-tip {
            color: #1b3a24;
            background: rgba(255, 255, 255, 0.95);
            border-color: rgba(46, 125, 50, 0.3);
        }

        /* =========================================================
           หน้าแรก 2 ปุ่ม + หน้าภัยธรรมชาติ
           ========================================================= */
        .home-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 18px;
        }

        .start-btn.alt {
            background: linear-gradient(to bottom, #b8863b, #8d6428);
        }

        .start-btn.alt:hover {
            background: linear-gradient(to bottom, #c9974a, #9c7233);
        }

        .d-title {
            margin: 0;
        }

        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }

        .tabs button {
            font-family: inherit;
            font-size: 0.95rem;
            color: #c8e6c9;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(200, 230, 201, 0.25);
            border-radius: 50px;
            padding: 9px 18px;
            cursor: pointer;
            transition: background 0.25s, color 0.25s;
        }

        .tabs button:hover {
            background: rgba(106, 159, 78, 0.2);
        }

        .tabs button.active {
            color: #ffffff;
            font-weight: 500;
            background: linear-gradient(to bottom, #6a9f4e, #4a7c36);
            border-color: transparent;
        }

        .risk-layout {
            display: grid;
            grid-template-columns: minmax(0, 3fr) minmax(0, 2fr);
            gap: 20px;
            align-items: start;
        }

        #riskMap {
            height: 72vh;
            min-height: 420px;
            background: #0b1a10;
        }

        .risk-panel {
            padding: 22px;
            max-height: 72vh;
            overflow-y: auto;
        }

        .risk-panel h3 {
            font-size: 1.3rem;
            font-weight: 500;
            margin-bottom: 6px;
        }

        .risk-panel .desc {
            font-size: 0.9rem;
            font-weight: 300;
            color: #c8e6c9;
            line-height: 1.6;
            margin-bottom: 14px;
        }

        .risk-panel .note {
            margin-top: 16px;
        }

        .level-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 14px;
        }

        .level-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(200, 230, 201, 0.15);
        }

        .lv-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .risk-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .risk-row {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            font-family: inherit;
            color: inherit;
            text-align: left;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(200, 230, 201, 0.1);
            border-radius: 14px;
            padding: 10px 14px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }

        .risk-row:hover,
        .risk-row.selected {
            background: rgba(106, 159, 78, 0.18);
            border-color: rgba(139, 195, 74, 0.45);
        }

        .risk-row .r-main {
            flex: 1;
            min-width: 0;
        }

        .risk-row .r-name {
            font-weight: 500;
        }

        .risk-row .r-sub {
            font-size: 0.8rem;
            font-weight: 300;
            color: #a5d6a7;
        }

        .level-badge {
            font-size: 0.75rem;
            font-weight: 500;
            color: #1b1b1b;
            padding: 3px 10px;
            border-radius: 50px;
            white-space: nowrap;
        }

        .risk-detail {
            background: rgba(106, 159, 78, 0.12);
            border: 1px solid rgba(139, 195, 74, 0.3);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 14px;
        }

        .risk-detail h4 {
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .risk-detail ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 0.9rem;
            font-weight: 300;
            line-height: 1.6;
            margin-bottom: 12px;
        }

        .risk-detail .skip-btn {
            font-size: 0.85rem;
            padding: 8px 16px;
        }

        .risk-empty {
            text-align: center;
            font-weight: 300;
            color: #a5d6a7;
            padding: 24px 0;
            line-height: 1.7;
        }

        @media (max-width: 860px) {
            .risk-layout {
                grid-template-columns: 1fr;
            }

            #riskMap {
                height: 50vh;
                min-height: 300px;
            }

            .risk-panel {
                max-height: none;
            }
        }

        /* โหมดสว่างของหน้าภัยธรรมชาติ */
        html.light #riskMap {
            background: #e8eee4;
        }

        html.light .tabs button {
            color: #2e5d34;
            background: rgba(255, 255, 255, 0.75);
            border-color: rgba(46, 125, 50, 0.25);
        }

        html.light .tabs button.active {
            color: #ffffff;
            background: linear-gradient(to bottom, #6a9f4e, #4a7c36);
        }

        html.light .risk-panel .desc,
        html.light .risk-row .r-sub,
        html.light .risk-empty {
            color: #4e6e52;
        }

        html.light .level-chip,
        html.light .risk-row {
            background: rgba(255, 255, 255, 0.85);
            border-color: rgba(46, 125, 50, 0.15);
        }

        html.light .risk-row:hover,
        html.light .risk-row.selected {
            background: rgba(220, 237, 200, 0.95);
            border-color: rgba(85, 139, 47, 0.5);
        }

        html.light .risk-detail {
            background: rgba(174, 213, 129, 0.3);
            border-color: rgba(85, 139, 47, 0.3);
        }

        /* เว้นที่ด้านบนบนมือถือ ไม่ให้สวิตช์โหมดทับปุ่มย้อนกลับ */
        @media (max-width: 600px) {
            .screen {
                padding-top: 64px;
            }
        }
    </style>
</head>
<body>

    <!-- สวิตช์โหมดมืด/สว่าง -->
    <div class="theme-switch">
        <button data-theme="dark">🌙 มืด</button>
        <button data-theme="light">☀️ สว่าง</button>
    </div>

    <!-- หน้าแรก -->
    <section id="home" class="screen active">
        <h1>🌿 Nature Innovation</h1>
        <p class="lead">เช็คสภาพอากาศและสภาพดินของแต่ละจังหวัดทั่วประเทศไทย</p>
        <div class="home-actions">
            <button class="start-btn" id="startBtn">🗺️ ดูข้อมูลพื้นที่</button>
            <button class="start-btn alt" id="disasterBtn">⚠️ ดูข้อมูลภัยธรรมชาติ</button>
        </div>
    </section>

    <!-- หน้าเลือกภูมิภาค -->
    <section id="regionScreen" class="screen">
        <div class="panel">
            <button class="back-btn" id="regionBack">← กลับหน้าแรก</button>
            <h2>เลือกภูมิภาค</h2>
            <p class="subtitle">เลือกภาคที่ต้องการดูข้อมูล หรือเลือกจากแผนที่</p>

            <button class="card map-card" id="mapEntry">
                <div class="icon">🗺️</div>
                <div>
                    <div class="name">เลือกจากแผนที่ประเทศไทย</div>
                    <div class="count">กดหมุดบนแผนที่เพื่อเลือกจังหวัด อำเภอ และตำบล</div>
                </div>
                <div class="arrow">→</div>
            </button>

            <div class="grid" id="regionGrid"></div>
        </div>
    </section>

    <!-- หน้ารายการ (ใช้ร่วมกัน: จังหวัด / อำเภอ / ตำบล) -->
    <section id="listScreen" class="screen">
        <div class="panel">
            <button class="back-btn" id="listBack">← ย้อนกลับ</button>
            <h2 id="listTitle"></h2>
            <p class="subtitle" id="listSubtitle"></p>
            <div class="list-actions" id="listActions"></div>
            <input type="text" class="search" id="listSearch" placeholder="🔍 พิมพ์เพื่อค้นหา...">
            <div class="grid small" id="listGrid"></div>
            <div class="list-msg" id="listMsg"></div>
        </div>
    </section>

    <!-- หน้าแผนที่ -->
    <section id="mapScreen" class="screen">
        <div class="map-wrap">
            <div class="map-top">
                <button class="back-btn" id="mapBack">← ย้อนกลับ</button>
                <div class="map-crumb" id="mapCrumb"></div>
            </div>

            <div class="map-layout" id="mapLayout">
                <div class="map-pane">
                    <div id="map"></div>
                    <div class="map-overlay">
                        <div class="map-hint" id="mapHint"></div>
                        <select class="map-select" id="mapSelect"></select>
                        <button class="skip-btn" id="mapSkip"></button>
                    </div>
                    <div class="legend" id="mapLegend"></div>
                    <div class="map-loading" id="mapLoading"></div>
                </div>
                <div class="info-pane" id="infoPane"></div>
            </div>
        </div>
    </section>

    <!-- หน้าภัยธรรมชาติ -->
    <section id="disasterScreen" class="screen">
        <div class="map-wrap">
            <div class="map-top">
                <button class="back-btn" id="disasterBack">← กลับหน้าแรก</button>
                <h2 class="d-title">⚠️ ข้อมูลภัยธรรมชาติ</h2>
            </div>

            <div class="tabs" id="riskTabs">
                <button data-tab="landslide">⛰️ เสี่ยงดินถล่ม</button>
                <button data-tab="flood">🌊 เสี่ยงน้ำท่วม</button>
                <button data-tab="events">📰 เหตุการณ์ที่เกิดขึ้นแล้ว</button>
            </div>

            <div class="risk-layout">
                <div class="map-pane">
                    <div id="riskMap"></div>
                    <div class="legend" id="riskLegend"></div>
                    <div class="map-loading hidden" id="riskLoading"></div>
                </div>
                <div class="window risk-panel" id="riskPanel"></div>
            </div>
        </div>
    </section>

    <!-- หน้าต่างข้อมูล -->
    <section id="resultScreen" class="screen">
        <div class="panel wide" id="resultPanel">
            <button class="back-btn" id="resultBack">← ย้อนกลับ</button>

            <div class="window" id="infoWindow">
                <div class="window-header">
                    <div>
                        <h2 id="provinceTitle"></h2>
                        <div class="place-path" id="placePath"></div>
                    </div>
                    <span class="region-tag" id="regionTag"></span>
                </div>

                <div class="window-body">
                    <nav class="sidebar" id="sidebar"></nav>
                    <div class="content" id="content"></div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // =========================================================

        // =========================================================

            {

            },
            {
                key: "northeast", color: "#ffca28", name: "ภาคตะวันออกเฉียงเหนือ", icon: "🌾",
                provinces: ["กาฬสินธุ์", "ขอนแก่น", "ชัยภูมิ", "นครพนม", "นครราชสีมา",
                            "บึงกาฬ", "บุรีรัมย์", "มหาสารคาม", "มุกดาหาร", "ยโสธร",
                            "ร้อยเอ็ด", "เลย", "ศรีสะเกษ", "สกลนคร", "สุรินทร์",
                            "หนองคาย", "หนองบัวลำภู", "อำนาจเจริญ", "อุดรธานี", "อุบลราชธานี"]
            },
            {
                key: "central", color: "#42a5f5", name: "ภาคกลาง", icon: "🏞️",
                provinces: ["กรุงเทพมหานคร", "กำแพงเพชร", "ชัยนาท", "นครนายก", "นครปฐม",
                            "นครสวรรค์", "นนทบุรี", "ปทุมธานี", "พระนครศรีอยุธยา", "พิจิตร",
                            "พิษณุโลก", "เพชรบูรณ์", "ลพบุรี", "สมุทรปราการ", "สมุทรสงคราม",
                            "สมุทรสาคร", "สระบุรี", "สิงห์บุรี", "สุโขทัย", "สุพรรณบุรี",
                            "อ่างทอง", "อุทัยธานี"]
